/* =====================================================================
   3. STORAGE ADAPTERS
   ---------------------------------------------------------------------
   Every read/write in the app goes through ONE interface, so a real backend
   can replace these classes without touching app code:

     get(col, id)            → doc | null
     put(col, id, doc)       → write whole doc
     patch(col, id, partial) → deep-merge into an existing doc
     listOpen()              → all songs with status 'open'
     pair(songIdA, songIdB, pairDoc) → atomically claim two open songs; true/false
     sub(col, id, cb)        → live updates for one doc; returns unsubscribe()
     report(reportDoc)       → store a report
     getUser(username)       → user | null
     putUser(user)           → write user record
     listTagged(mood)        → mood-tag docs whose moods include `mood` (powers "Find by mood")
     listWhere(col, field, op, value) → docs where field == value / array-contains value
                               (notifications for a user, direct messages for a user)
   (Profile images are plain docs in the bs_media collection via get/put;
    mood tags are plain docs in bs_tags, one per song+tagger, written with put.)
   ===================================================================== */
const USERS = 'bs_users', SONGS = 'bs_songs', PAIRS = 'bs_pairs', REPORTS = 'bs_reports', TAGS = 'bs_tags', NOTES = 'bs_notes', MSGS = 'bs_msgs', GIFTS = 'bs_gifts', OFFERS = 'bs_offers', FRIENDS = 'bs_friends';
const OFFER_MAX = 10, OFFER_TTL = 7 * 86400000;

/** Local mode: localStorage (shared across tabs of this browser) + polling/storage events. */
class LocalAdapter {
  constructor() {
    this.mode = 'local';
    this.mem = {};
    this.listeners = new Set();
    try { localStorage.setItem('bs1:probe', '1'); localStorage.removeItem('bs1:probe'); this.ok = true; } catch { this.ok = false; }
    window.addEventListener('storage', e => { if (!e.key || e.key.startsWith('bs1:')) this._notify(); });
    setInterval(() => this._notify(), 1500);
  }
  _read(col) {
    if (!this.ok) return this.mem[col] || {};
    try { return JSON.parse(localStorage.getItem('bs1:' + col) || '{}'); } catch { return {}; }
  }
  _write(col, map) {
    if (!this.ok) { this.mem[col] = map; return; }
    try { localStorage.setItem('bs1:' + col, JSON.stringify(map)); }
    catch { throw new Error('This browser blocked saving. Free some space or leave private mode.'); }
  }
  _notify() { for (const f of this.listeners) { try { f(); } catch (e) { console.error(e); } } }
  async get(col, id) { return clone(this._read(col)[id] || null); }
  async put(col, id, doc) { const m = this._read(col); m[id] = clone(doc); this._write(col, m); this._notify(); }
  async patch(col, id, partial) {
    const m = this._read(col);
    if (!m[id]) throw new Error('That record no longer exists.');
    deepMerge(m[id], clone(partial)); this._write(col, m); this._notify();
  }
  async listOpen() { return Object.values(this._read(SONGS)).filter(s => s.status === 'open').map(clone); }
  async listTagged(mood) { return Object.values(this._read(TAGS)).filter(t => Array.isArray(t.moods) && t.moods.includes(mood)).map(clone); }
  async listWhere(col, field, op, value) {
    return Object.values(this._read(col)).filter(d => (op === 'array-contains' ? Array.isArray(d[field]) && d[field].includes(value) : d[field] === value)).map(clone);
  }
  /** Local-only: give the 15 sample songs some mood tags so "Find by mood" has something to show solo. */
  seedTags() {
    const meta = this._read('bs_meta'); if (meta.tagsSeeded) return;
    const tags = this._read(TAGS);
    SEEDS.forEach((s, i) => {
      const l = parseSongLink(s.url), key = `${l.kind}-${l.id}`;
      tags[`${key}__sample${i}`] = { key, url: l.url, kind: l.kind, title: s.title, artist: s.artist, note: s.note, moods: [...new Set([s.mood, MOODS[(i * 7 + 3) % MOODS.length].k])], source: 'sample', at: Date.now() - i * 1000 };
    });
    this._write(TAGS, tags); this._write('bs_meta', { ...this._read('bs_meta'), tagsSeeded: true });
  }
  async pair(a, b, pairDoc) {
    const songs = this._read(SONGS);
    if (songs[a]?.status !== 'open' || songs[b]?.status !== 'open') return false;
    const pairs = this._read(PAIRS); pairs[pairDoc.id] = clone(pairDoc); this._write(PAIRS, pairs);
    songs[a].status = songs[b].status = 'paired'; songs[a].pairId = songs[b].pairId = pairDoc.id;
    this._write(SONGS, songs); this._notify();
    return true;
  }
  sub(col, id, cb) {
    let last;
    const check = () => {
      const d = this._read(col)[id] || null, s = JSON.stringify(d);
      if (s !== last) { last = s; cb(clone(d)); }
    };
    this.listeners.add(check); setTimeout(check, 0);
    return () => this.listeners.delete(check);
  }
  async report(r) { await this.put(REPORTS, r.id, r); }
  async getUser(u) { return this.get(USERS, u); }
  async putUser(u) { return this.put(USERS, u.username, u); }
  /** Local-only: seed 15 sample songs from fake strangers (once, or on refill). */
  seed(force = false) {
    const songs = this._read(SONGS);
    const openBots = Object.values(songs).filter(s => s.bot && !s.testFor && s.status === 'open').length;
    if (!force && (this._read('bs_meta').seeded)) return;
    if (force && openBots >= SEEDS.length) return;
    const base = Date.now() - 86400000;
    SEEDS.forEach((s, i) => {
      const link = parseSongLink(s.url), id = 's_seed_' + i + '_' + Date.now().toString(36);
      songs[id] = { id, owner: 'bot_' + String(i + 1).padStart(2, '0'), bot: true, kind: link.kind, url: link.url, title: s.title, artist: s.artist, note: s.note, mood: s.mood, displayName: s.name, status: 'open', createdAt: base + i * 60000 };
    });
    this._write(SONGS, songs);
    this._write('bs_meta', { ...this._read('bs_meta'), seeded: true });
  }
}

/** Shared mode: the artifact's realtime document store (claude.use('db')). */
class SharedAdapter {
  constructor(db) { this.mode = 'shared'; this.db = db; this.holder = uid('h_'); }
  _ref(col, id) { return this.db.doc(`${col}/${id}`); }
  async _retry(fn) {
    try { return await fn(); }
    catch (e) { if (e?.code === 'unavailable') { await sleep(300 + Math.random() * 500); return fn(); } throw e; }
  }
  async get(col, id) { const s = await this._retry(() => this._ref(col, id).get()); return s.exists ? clone(s.data()) : null; }
  async put(col, id, doc) { await this._retry(() => this._ref(col, id).set(clone(doc))); }
  async patch(col, id, p) { await this._retry(() => this._ref(col, id).update(clone(p))); }
  async listOpen() {
    const q = await this._retry(() => this.db.collection(SONGS).where('status', '==', 'open').limit(300).get());
    return q.docs.map(d => clone(d.data()));
  }
  async listTagged(mood) {
    const q = await this._retry(() => this.db.collection(TAGS).where('moods', 'array-contains', mood).limit(500).get());
    return q.docs.map(d => clone(d.data()));
  }
  async listWhere(col, field, op, value) {
    const q = await this._retry(() => this.db.collection(col).where(field, op, value).limit(500).get());
    return q.docs.map(d => clone(d.data()));
  }
  async pair(a, b, pairDoc) {
    const ra = this._ref(SONGS, a), rb = this._ref(SONGS, b);
    try { // cooperative leases so two people can't claim the same waiting song
      const [la, lb] = await Promise.all([ra.acquire({ holder: this.holder, ttlMs: 8000 }), rb.acquire({ holder: this.holder, ttlMs: 8000 })]);
      if (!la.acquired || !lb.acquired) return false;
    } catch (e) { if (e?.code !== 'capability_removed') console.warn('lease unavailable, continuing', e); }
    const [sa, sb] = await Promise.all([ra.get(), rb.get()]);
    if (!sa.exists || !sb.exists || sa.data().status !== 'open' || sb.data().status !== 'open') return false;
    await this._ref(PAIRS, pairDoc.id).set(clone(pairDoc));
    await ra.update({ status: 'paired', pairId: pairDoc.id });
    await rb.update({ status: 'paired', pairId: pairDoc.id });
    return true;
  }
  sub(col, id, cb) {
    return this._ref(col, id).onSnapshot(s => cb(s.exists ? clone(s.data()) : null), e => console.warn('live updates stopped', e));
  }
  async report(r) { await this.put(REPORTS, r.id, r); }
  async getUser(u) { return this.get(USERS, u); }
  async putUser(u) { return this.put(USERS, u.username, u); }
}

/** Pick the backend: shared db when the host offers it and lets this viewer write; otherwise local. */
async function createStore() {
  if (window.claude && typeof window.claude.use === 'function') {
    try {
      const db = await Promise.race([window.claude.use('db'), sleep(7000).then(() => null)]);
      if (db) {
        let canWrite = null;
        try {
          const user = await Promise.race([window.claude.use('user'), sleep(3000).then(() => null)]);
          canWrite = user ? await user.can('data.write') : null;
        } catch { /* unknown → try shared */ }
        if (canWrite !== false) return { store: new SharedAdapter(db), note: '' };
        return { store: new LocalAdapter(), note: 'Shared storage is view-only for you, so this tab runs locally.' };
      }
    } catch (e) { console.warn('shared storage unavailable', e); }
  }
  return { store: new LocalAdapter(), note: '' };
}

/* Uploaded images live in their own docs (bs_media/<user>__avatar|bg) so the user record stays small.

const kb = n => (n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.round(n / 1024) + ' KB');

let assetsP = null;
const getAssets = () => (assetsP ||= (async () => {
  try { if (!window.claude || typeof window.claude.use !== 'function') return null; return await Promise.race([window.claude.use('assets'), sleep(4000).then(() => null)]); }

/** Big images are stored as a small header doc (size, crop, part count) plus numbered part docs holding slices of the data URI. */
async function readMedia(username, kind) {

  if (!head) return null;
  if (typeof head.assetId === 'string') return ID_RE.test(head.assetId) ? safeImg({ ...head, data: '/_blob/' + head.assetId }) : null;   // lives in file storage
  if (!head.parts) return safeImg(head);                       // single-record format (earlier versions)
  const n = Math.min(Math.max(0, head.parts | 0), 40);
  const parts = await Promise.all(Array.from({ length: n }, (_, i) => S.store.get(MEDIA, `${username}__${kind}__p${i}`)));

async function saveMedia(username, kind, m) {

  if (!m) { await S.store.put(MEDIA, `${username}__${kind}`, { ...base, data: '', parts: 0 }); return; }
  if (m.assetId) { const { data: _d, ...meta } = m; await S.store.put(MEDIA, `${username}__${kind}`, { ...meta, ...base, parts: 0 }); return; }
  const parts = []; for (let i = 0; i < m.data.length; i += MEDIA_PART) parts.push(m.data.slice(i, i + MEDIA_PART));
  for (let i = 0; i < parts.length; i++) await S.store.put(MEDIA, `${username}__${kind}__p${i}`, { owner: username, i, d: parts[i] });
  const { data, ...meta } = m;                                  // header goes last so readers never see it without its parts

const S = {

/** Award newly-earned badges, persist the user, then toast the new ones. */
async function commitUser() {
  const u = S.user, fresh = [];

function songPublic(s) {
  return { id: s.id, owner: s.owner, url: s.url, kind: s.kind, title: s.title || '', artist: s.artist || '', note: s.note, mood: s.mood, displayName: s.displayName };
}
/** The sender's "why this one" line, shown under the card now that the card shows the song name. */
const noteQuote = (song, label = 'Their note') => (song?.note && song?.title ? `<p class="note-q"><small>${label}</small>“${esc(song.note)}”</p>` : '');
function makePair(a, b) {
  return { id: uid('p_'), users: [a.owner, b.owner], songs: { [a.owner]: songPublic(a), [b.owner]: songPublic(b) }, createdAt: Date.now(),
    reactions: {}, thanks: {}, saved: {}, removed: {}, bot: a.bot ? a.owner : (b.bot ? b.owner : null) };

const partnerOf = p => p.users.find(x => x !== me());

/* ---------- pool, offers and swaps ----------
   1. A song is submitted straight into the pool (bs_songs, status 'open'). Its mood is required.
   2. Someone pulls a random pool song by mood and OFFERS one of their own open songs for it (bs_offers).
   3. The owner sees the offered song (never who sent it) and accepts or declines.
   4. Accepting pairs both songs (one swap per song) and opens the swap for both people (bs_pairs).
   Offers expire after 7 days. Each person can send 10 offers a day (UTC). */
const isLive = o => !!o && o.status === 'pending' && Date.now() - (+o.at || 0) < OFFER_TTL;
const offerId = (offerSongId, targetSongId) => `o__${offerSongId}__${targetSongId}`;
const daysLeft = o => Math.max(1, Math.ceil(((+o.at || 0) + OFFER_TTL - Date.now()) / 86400000));
const offersToday = u => (u.offerDay?.date === todayUTC() ? u.offerDay.count : 0);

/** A random open pool song in this mood: never mine, never one I already offered to, test strangers only for their creator. */
async function pullSong(mood) {
  const [open, out] = await Promise.all([S.store.listOpen(), S.store.listWhere(OFFERS, 'from', '==', me())]);
  const tried = new Set(out.map(o => o.targetSongId));
  let pool = open.filter(s => s.mood === mood && s.owner !== me() && (!s.testFor || s.testFor === me()) && !tried.has(s.id) && parseSongLink(s.url));
  const fresh = pool.filter(s => !S.find.seen.has(s.id));
  if (fresh.length) pool = fresh; else S.find.seen.clear();   // seen them all: start the loop again
  return { song: pool.length ? pick(pool) : null, total: pool.length };
}

async function sendOffer(target, mine) {
  const u = S.user;
  if (!target || !mine || mine.owner !== me() || target.owner === me()) throw new Error('That swap is not possible.');
  if (offersToday(u) >= OFFER_MAX) throw new Error(`You've sent all ${OFFER_MAX} offers for today. The count resets at midnight UTC.`);
  const [t, m] = await Promise.all([S.store.get(SONGS, target.id), S.store.get(SONGS, mine.id)]);
  if (!t || t.status !== 'open') throw new Error('That song was just swapped. Pull another one.');
  if (!m || m.status !== 'open') throw new Error('That song of yours is no longer available to offer.');
  const id = offerId(m.id, t.id);
  await S.store.put(OFFERS, id, { id, from: me(), to: t.owner, offerSongId: m.id, targetSongId: t.id, offerSong: songPublic(m), targetSong: songPublic(t), status: 'pending', at: Date.now(), pairId: '' });
  const day = todayUTC(); if (u.offerDay?.date !== day) u.offerDay = { date: day, count: 0 };
  u.offerDay.count++; await commitUser();
  await notify(t.owner, 'offer', '', `A stranger offered you a song for “${t.title || 'your song'}”.`);
  if (isBotName(t.owner)) setTimeout(resolveBotOffers, 4000 + Math.random() * 3000);
}

/** Cancel every other pending offer that involves these songs (they just got swapped or taken down). */
async function voidOffersFor(ids, exceptId, exceptFrom) {
  for (const field of ['targetSongId', 'offerSongId']) for (const id of ids) {
    let list = []; try { list = await S.store.listWhere(OFFERS, field, '==', id); } catch { continue; }
    for (const x of list) {
      if (x.id === exceptId || x.status !== 'pending') continue;
      try { await S.store.patch(OFFERS, x.id, { status: 'void' }); } catch { continue; }
      if (x.from !== exceptFrom) await notify(x.from, 'declined', '', 'An offer you sent is no longer available. Your song is free to offer again.');
    }
  }
}

/** Accept an offer: pairs the two songs, notifies both people. Returns the new pair, or null if a song was already taken. */
async function acceptOffer(o, asBot = false) {
  if (!asBot && o.to !== me()) throw new Error('This offer is not yours to accept.');
  const [t, m] = await Promise.all([S.store.get(SONGS, o.targetSongId), S.store.get(SONGS, o.offerSongId)]);
  const gone = async () => { try { await S.store.patch(OFFERS, o.id, { status: 'void' }); } catch {} return null; };
  if (!t || !m || t.status !== 'open' || m.status !== 'open') return gone();
  const pair = makePair(t, m);
  if (!(await S.store.pair(t.id, m.id, pair))) return gone();
  await S.store.patch(OFFERS, o.id, { status: 'accepted', pairId: pair.id });
  await voidOffersFor([t.id, m.id], o.id, o.from);
  await notify(o.from, 'accepted', pair.id, 'A stranger accepted your offer. Listen and react to break the seal.');
  await notify(o.to, 'match', pair.id, 'You accepted a swap. Listen and react to break the seal.');
  return pair;
}
async function declineOffer(o) {
  await S.store.patch(OFFERS, o.id, { status: 'declined' });
  await notify(o.from, 'declined', '', 'A stranger passed on your offer. Your song is free to offer again.');
}
async function withdrawOffer(o) { await S.store.patch(OFFERS, o.id, { status: 'withdrawn' }); }
async function takeDown(song) {
  await S.store.patch(SONGS, song.id, { status: 'removed' });
  await voidOffersFor([song.id], '', '');

/** Sample/test strangers answer the offers I send them (accept ~85%, test_stranger always). Resumes after a refresh too. */
async function resolveBotOffers() {
  if (!S.user || S.resolving) return;
  S.resolving = true;
  try {
    const out = await S.store.listWhere(OFFERS, 'from', '==', me());
    for (const o of out) {
      if (!isLive(o) || !isBotName(o.to) || Date.now() - o.at < 3000) continue;
      const yes = o.to === 'test_stranger' || [...o.id].reduce((a, c) => a + c.charCodeAt(0), 0) % 100 < 85;
      if (yes) await acceptOffer(o, true); else await declineOffer(o);
    }
    await refreshCounts(true);
  } catch (e) { console.warn('bot offers', e); } finally { S.resolving = false; }
}
/** A sample stranger offers me one of the pool's bot songs for one of mine (local demo only). */

  if (!S.user) return false;
  const open = await S.store.listOpen();
  const cands = open.filter(s => isBotName(s.owner) && (fromTestStranger ? (s.owner === 'test_stranger' && s.testFor === me()) : s.owner !== 'test_stranger'));
  const c = pick(cands); if (!c) return false;
  const id = offerId(c.id, mine.id);
  await S.store.put(OFFERS, id, { id, from: c.owner, to: me(), offerSongId: c.id, targetSongId: mine.id, offerSong: songPublic(c), targetSong: songPublic(mine), status: 'pending', at: Date.now(), pairId: '' });

/* ---------- friends ----------

const friendId = (a, b) => `f__${[a, b].sort().join('__')}`;
function friendState(other) {

  if (ex && ex.status === 'pending' && ex.from === other) return answerFriend(ex, true);
  await S.store.put(FRIENDS, id, { id, users: [me(), other], from: me(), status: 'pending', pairId: pair.id, at: Date.now() });
  await notify(other, 'friend', pair.id, `${pair.songs[me()]?.displayName || 'A stranger'} sent you a friend request.`);
  if (isBotName(other)) setTimeout(() => botFriend(id, other), 3000);
}

    const f = await S.store.get(FRIENDS, id); if (!f || f.status !== 'pending') return;
    await S.store.patch(FRIENDS, id, { status: 'accepted' });

/** Draw the friend button for a swap into `zone` (re-draws itself after clicks). `getPair` returns the freshest pair. */
function friendZone(zone, getPair) {
  const draw = () => {
    const pair = getPair(), other = partnerOf(pair), st = friendState(other);
    if (!canMessage(pair)) zone.innerHTML = `<button class="btn" type="button" disabled title="Available once you've both reacted">🤝 Add friend</button>`;
    else if (st === 'friends') zone.innerHTML = `<span class="btn on" aria-disabled="true">🤝 Friends</span>`;
    else if (st === 'sent') zone.innerHTML = `<span class="btn on" aria-disabled="true">🤝 Request sent</span>`;
    else if (st === 'incoming') zone.innerHTML = `<button class="btn primary" id="frGo" type="button">🤝 Accept friend request</button>`;
    else zone.innerHTML = `<button class="btn" id="frGo" type="button">🤝 Add friend</button>`;
    const b = zone.querySelector('#frGo'); if (!b) return;
    b.onclick = async () => {
      b.disabled = true;
      try { await requestFriend(getPair()); await refreshCounts(false); toast(friendState(partnerOf(getPair())) === 'friends' ? 'You are friends now.' : 'Friend request sent.'); }
      catch { toast('Could not send that. Try again.'); }

async function tagSong(song, moods, tagger, source) {
  const l = parseSongLink(song?.url), ks = (moods || []).filter(k => moodOf(k)).slice(0, 3);
  if (!l || !ks.length) return;
  const key = `${l.kind}-${l.id}`, who = (await sha256('tag:' + tagger)).slice(0, 16);
  await S.store.put(TAGS, `${key}__${who}`, { key, url: l.url, kind: l.kind, title: String(song.title || '').slice(0, 80), artist: String(song.artist || '').slice(0, 60),
    note: String(song.note || '').slice(0, 90), moods: ks, source, at: Date.now() });
}

/** Fake strangers / test stranger react to MY song after a short, human-ish delay. */
function maybeBotReact(pair) {
  const bot = pair.bot;
  if (!bot || pair.reactions?.[bot] || S.botTimers[pair.id]) return;
  S.botTimers[pair.id] = setTimeout(async () => {
    try {
      const human = pair.users.find(x => x !== bot), song = pair.songs[human];
      const moods = [...new Set([song.mood, pick(MOODS).k])].filter(k => moodOf(k));
      const r = { emoji: pick(REACTIONS).e, land: 3 + Math.floor(Math.random() * 3), comment: pick(BOT_COMMENTS), moods, at: Date.now() };
      await S.store.patch(PAIRS, pair.id, { reactions: { [bot]: r } });
      try { await tagSong(song, moods, bot, 'listener'); await tagSong(song, [song.mood], human, 'sender'); } catch {}
      await notify(human, 'reacted', pair.id, 'Your stranger reacted to your song.');
      if (Math.random() < 0.6) await giveCassettes(pair, pick([1, 3]), bot); // so receiving cassettes can be tested solo
    } catch (e) { console.warn(e); }
  }, 3500 + Math.random() * 5000);
}

/** Register swaps I'm part of (someone may have accepted while I was away), keep my match count right, wake sample strangers. */

  const mine = (await S.store.listWhere(PAIRS, 'users', 'array-contains', me())).filter(p => p && Array.isArray(p.users) && p.songs);
  const u = S.user; let added = 0;

/** Submit: the song goes straight into the pool. No waiting. */
async function submitSong() {
  const d = S.sub.draft, u = S.user;
  const link = parseSongLink(d.link);
  if (!link) throw new Error('That link is not from a supported music site.');
  if (!moodOf(d.mood)) throw new Error('Pick the mood that fits before you submit.');
  if (todayCount(u) >= DAILY_MAX) throw new Error(`You've submitted all ${DAILY_MAX} songs for today.`);
  const song = { id: uid('s_'), owner: u.username, kind: link.kind, url: link.url, title: d.title.trim(), artist: d.artist.trim(), note: d.note.trim(), mood: d.mood, displayName: u.username, status: 'open', createdAt: Date.now() };
  await S.store.put(SONGS, song.id, song);
  const t = todayUTC(); if (u.day?.date !== t) u.day = { date: t, count: 0 };
  u.day.count++; u.stats.submitted++;
  if (!u.stats.moods.includes(song.mood)) u.stats.moods.push(song.mood);
  u.stats.maxDay = Math.max(u.stats.maxDay, u.day.count);
  if (new Date().getHours() < 5) u.stats.nightOwl = 1;
  await commitUser();
  S.sub = { stage: 'done', draft: { link: '', title: '', artist: '', note: '', mood: '', name: '' }, song };
  if (S.mode === 'local' && Math.random() < 0.7) setTimeout(() => botOffer(song).catch(() => {}), 7000 + Math.random() * 8000);
  render();
}

/* Day / night mode: the early script in the page head applies the saved (or system) choice before first paint. */
/** The Resonance Rift window shows the same pixel sky + landscape as the desktop (day or night), painted inside the window. */
function syncRrBg() {
  const el = document.getElementById('rrBg'); if (!el) return;
  // read the site's own pixel sky for the current mode, ignoring whatever wallpaper the desktop settings put on the page
  const rs = document.documentElement.style, props = ['background-image', 'background-size', 'background-position', 'background-repeat', 'background-attachment', 'background-color'];
  const kept = props.map(p => [p, rs.getPropertyValue(p)]); props.forEach(p => rs.removeProperty(p));
  const cs = getComputedStyle(document.documentElement), snap = { backgroundImage: cs.backgroundImage, backgroundSize: cs.backgroundSize, backgroundPosition: cs.backgroundPosition, backgroundRepeat: cs.backgroundRepeat, backgroundColor: cs.backgroundColor };
  kept.forEach(([p, v]) => { if (v) rs.setProperty(p, v); });
  Object.assign(el.style, snap, { backgroundAttachment: 'scroll' });
}

/** Animated pink digital rain (canvas) plus a pulsing neon heart behind the login screen. Stops itself once the login view is gone. */
function startRain(host) {
  host.querySelector('.rain-bg')?.remove();
  const wrap = document.createElement('div'); wrap.className = 'rain-bg'; wrap.setAttribute('aria-hidden', 'true');
  wrap.innerHTML = '<canvas></canvas><svg class="rain-heart" viewBox="0 0 100 90"><path d="M50 84 C10 52 2 30 14 14 C26 0 44 6 50 22 C56 6 74 0 86 14 C98 30 90 52 50 84Z"/></svg>';
  host.prepend(wrap);
  const cv = wrap.firstChild, cx = cv.getContext('2d'), fs = 18;
  const G = 'ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ0123456789:=*+-<>|'.split('');
  let W = 0, H = 0, cols = 0, y = [], sp = [], lastCh = [];
  const fit = () => {
    const w = host.clientWidth, h = host.clientHeight; if (!w || !h) return false;
    if (w !== W || h !== H) {
      W = w; H = h; cv.width = W; cv.height = H; cols = Math.ceil(W / fs);
      y = Array.from({ length: cols }, () => Math.random() * H / fs * -1.2); sp = Array.from({ length: cols }, () => .25 + Math.random() * .6); lastCh = [];
      cx.fillStyle = '#08020a'; cx.fillRect(0, 0, W, H);
      for (let k = 0; k < 110; k++) step();   // pre-warm so the rain is already falling
    }
    return true;
  };
  const step = () => {
    cx.fillStyle = 'rgba(8,2,10,.09)'; cx.fillRect(0, 0, W, H);
    cx.font = fs + 'px monospace'; cx.textBaseline = 'top'; cx.shadowColor = '#8C45A8'; cx.shadowBlur = 10;
    for (let i = 0; i < cols; i++) {
      const prev = Math.floor(y[i]); y[i] += sp[i]; const row = Math.floor(y[i]); if (row === prev) continue;
      if (lastCh[i] && prev >= 0) { cx.fillStyle = '#F58EA3'; cx.fillText(lastCh[i], i * fs, prev * fs); }
      const ch = G[(Math.random() * G.length) | 0]; lastCh[i] = ch;
      if (row >= 0) { cx.fillStyle = '#f5e8fa'; cx.fillText(ch, i * fs, row * fs); }
      if (row * fs > H && Math.random() > .975) y[i] = -Math.random() * 10;
    }
  };
  if (window.matchMedia('(prefers-reduced-motion:reduce)').matches) { if (fit()) for (let k = 0; k < 160; k++) step(); return; }
  let last = 0;
  const frame = t => { if (!wrap.isConnected) return; requestAnimationFrame(frame); if (t - last < 45 || !fit()) return; last = t; step(); };
  requestAnimationFrame(frame);
}

/** Login sequence: warning pop-ups pile up while the account loads, then an "ACCESS GRANTED" box. */
function hackFx(host) {
  const fx = document.createElement('div'); fx.className = 'hack-fx'; fx.setAttribute('aria-hidden', 'true'); host.append(fx);
  const sc = document.getElementById('rrBody');   // cover only what the window currently shows
  if (sc) { const off = Math.max(0, host.offsetTop - sc.scrollTop); fx.style.inset = 'auto'; fx.style.left = fx.style.right = '0'; fx.style.top = Math.max(0, sc.scrollTop - host.offsetTop) + 'px'; fx.style.height = Math.max(200, sc.clientHeight - off) + 'px'; }
  const MSG = [['Warning:', 'System overload'], ['Warning:', 'Heart rate critical'], ['Error:', 'Too many feelings'], ['Alert:', 'Stranger detected'], ['Warning:', 'Playlist overflow'], ['Caution:', 'Vibes unstable']];
  const t0 = Date.now(); let n = 0, tm = 0, alive = true;
  const spawn = () => {
    const W = fx.clientWidth || 600, H = fx.clientHeight || 400, p = document.createElement('div'), m = MSG[(Math.random() * MSG.length) | 0];
    p.className = 'hack-pop'; p.innerHTML = '<span></span><b></b>'; p.firstChild.textContent = m[0]; p.lastChild.textContent = m[1];
    const w = Math.min(W * .8, 240 + Math.random() * 130); p.style.width = w + 'px';
    p.style.left = (Math.random() * (W * 1.05 - w) - W * .03) + 'px'; p.style.top = (Math.random() * (H - 70) - 10) + 'px';
    fx.append(p); if (++n > 34) fx.querySelector('.hack-pop')?.remove();
  };
  const loop = () => { if (!alive) return; spawn(); tm = setTimeout(loop, Math.max(25, 90 - n * 4)); };
  loop();
  return {
    stop() { alive = false; clearTimeout(tm); fx.remove(); },
    async grant() {
      const wait = 1300 - (Date.now() - t0); if (wait > 0) await new Promise(r => setTimeout(r, wait));
      alive = false; clearTimeout(tm);
      const ok = document.createElement('div'); ok.className = 'hack-ok'; ok.textContent = 'Access granted'; fx.append(ok);
      await new Promise(r => setTimeout(r, 1100));
      fx.remove();
    },
  };
}

/* ---------- step bars ---------- */
const STEP_SETS = { sub: ['Song', 'In the pool'], swap: ['Accepted', 'React', 'Reveal'] };
/* The first step is a way back once you're past it (submit form / Swaps list); later steps can't be revisited. */
const stepsBar = (kind, cur) => `<ol class="steps" aria-label="Progress">${STEP_SETS[kind].map((s, i) => {
  const label = i === 0 && cur > 0 ? (kind === 'sub' ? `<a href="#submit" data-step-back>${s}</a>` : `<a href="#swaps">${s}</a>`) : s;
  return `<li class="${i === cur ? 'now' : i < cur ? 'done' : ''}"${i === cur ? ' aria-current="step"' : ''}>${label}</li>`; }).join('')}</ol>`;
document.addEventListener('click', e => {
  const a = e.target.closest('[data-step-back]'); if (!a) return;
  e.preventDefault();
  if (S.sub.stage === 'done') S.sub = { stage: 'offer', draft: { link: '', title: '', artist: '', note: '', mood: '', name: '' }, song: null }; else S.sub.stage = 'offer';
  location.hash === '#submit' ? render() : (location.hash = 'submit');
});

/* ---------- submit: song + mood → straight into the pool ---------- */
function renderSubmit() {
  const st = S.sub.stage;
  if (st === 'done') return renderSubmitted();
  return renderOffer();
}

function renderOffer() {
  const u = S.user, used = todayCount(u), d = S.sub.draft;
  d.title = d.title || ''; d.artist = d.artist || '';
  if (used >= DAILY_MAX) {
    const now = new Date(), next = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate() + 1), mins = Math.ceil((next - now) / 60000);
    view().innerHTML = `${stepsBar('sub', 0)}<section class="panel empty">${orb(110)}<h2>That's ten for today.</h2>
      <p class="muted">You've submitted ${DAILY_MAX}/${DAILY_MAX} songs today. The count resets at midnight UTC, in about ${Math.floor(mins / 60)}h ${mins % 60}m.</p>
      <a class="btn" href="#find">Find a song instead</a></section>`;
    return;
  }
  view().innerHTML = `${stepsBar('sub', 0)}
  <div class="grid2">
    <form class="panel" id="offerForm" novalidate>
      <div class="oc-info"><span class="s-ic" aria-hidden="true">☺</span><span class="s-ic" aria-hidden="true">♥</span><span class="s-ic star" aria-hidden="true">★</span><b>Add a song to the pool</b><span class="tag quota" title="Songs you've submitted today (UTC)"><b>${used}</b>/10 today</span></div>
      <div class="oc-chat">
        <div class="oc-row"><img class="oc-av" alt="" src="${ICO.bow}"><div class="oc-bub">
          <label for="f-link">Music link</label>
          <input type="url" id="f-link" inputmode="url" autocomplete="off" placeholder="Paste a Spotify, Apple Music, YouTube… link" value="${esc(d.link)}">
          <p class="hint" id="linkHint">Paste a song, album or playlist link from ${SERVICE_LIST}.</p>
        </div></div>
        <div class="oc-row"><img class="oc-av" alt="" src="${ICO.heart}"><div class="oc-bub">
          <div class="two">
            <div><label for="f-title"><span>Song name</span></label><input type="text" id="f-title" maxlength="80" autocomplete="off" placeholder="Mr. Brightside" value="${esc(d.title)}"></div>
            <div><label for="f-artist"><span>Artist</span></label><input type="text" id="f-artist" maxlength="60" autocomplete="off" placeholder="The Killers" value="${esc(d.artist)}"></div>
          </div>
          <p class="hint" id="metaHint">Shown on the player so they know what they're about to hear.</p>
        </div></div>
        <div class="oc-row"><img class="oc-av" alt="" src="${ICO.envelope}"><div class="oc-bub">
          <label for="f-note"><span>Why this one?</span><span class="ctr" id="noteCtr">${d.note.length}/90</span></label>
          <input type="text" id="f-note" maxlength="90" placeholder="The bridge at 2:10 lives in my head rent-free" value="${esc(d.note)}">
        </div></div>
        <div class="oc-row"><img class="oc-av" alt="" src="${ICO.star}"><div class="oc-bub">
          <fieldset><legend>Mood</legend><div class="chips">
            ${MOODS.map(m => `<label class="chip" style="margin:0;font-weight:500"><input type="radio" name="mood" value="${m.k}"${d.mood === m.k ? ' checked' : ''}><span>${m.i} ${m.l}</span></label>`).join('')}
          </div></fieldset>
        </div></div>
      </div>
      <div class="oc-bar"><p class="err" id="offerErr" role="alert"></p><button class="btn primary" type="submit">Add to the pool</button></div>
    </form>
    <aside class="stack"><p class="eyebrow">What a stranger sees when they pull it</p><div id="offerPreview"></div>
      <p class="hint">Strangers pull songs by mood, so the mood you pick decides who can find yours.</p></aside>
  </div>`;
  const link = $('#f-link'), note = $('#f-note'), hint = $('#linkHint'), ti = $('#f-title'), ar = $('#f-artist');
  let looked = '';
  /* Best effort: fill name/artist from the platform's public oEmbed endpoint (no key needed).
     Hosts that block outside requests (e.g. the claude.ai artifact) simply skip this. */
  const autofill = async p => {
    if (!p || looked === p.url || (ti.value.trim() && ar.value.trim())) return;
    looked = p.url;
    if (p.kind !== 'spotify' && p.kind !== 'youtube') return;   // only these two offer a public lookup
    const ep = p.kind === 'spotify' ? `https://open.spotify.com/oembed?url=${encodeURIComponent(p.url)}` : `https://www.youtube.com/oembed?format=json&url=${encodeURIComponent(p.url)}`;
    try {
      const ctl = new AbortController(); setTimeout(() => ctl.abort(), 3500);
      const j = await (await fetch(ep, { signal: ctl.signal })).json();
      if (looked !== p.url) return;
      const by = String(j.author_name || '').replace(/\s*(- Topic|VEVO|Official)$/i, '').trim().slice(0, 60);
      let name = String(j.title || '').replace(/\s*[([][^)\]]*(official|video|audio|lyric|visuali[sz]er|hd|4k|remaster)[^)\]]*[)\]]/gi, '').trim();
      const dash = name.match(/^(.+?)\s+[-–—]\s+(.+)$/); // "Artist - Title" (YouTube style)
      if (dash && by && dash[1].toLowerCase().includes(by.toLowerCase())) name = dash[2];
      name = name.slice(0, 80);
      if (name && !ti.value.trim()) ti.value = name;
      if (by && !ar.value.trim()) ar.value = by;
      if (name || by) { $('#metaHint').textContent = 'Filled in from the link. Check it reads right.'; update(); }
    } catch { /* blocked or offline: the person types it */ }
  };
  const update = () => {
    d.link = link.value; d.note = note.value; d.title = ti.value; d.artist = ar.value;
    $('#noteCtr').textContent = `${note.value.length}/90`;
    const p = parseSongLink(link.value);
    if (!link.value.trim()) { hint.className = 'hint'; hint.textContent = `Paste a song, album or playlist link from ${SERVICE_LIST}.`; }
    else if (p) { hint.className = 'hint good'; hint.textContent = `Looks good: ${serviceName(p.kind)} ${p.type === 'link' ? 'link' : p.type}. Add its name and artist below.`; }
    else { hint.className = 'hint'; hint.textContent = `That link isn't from a supported site. Use the full link from ${SERVICE_LIST}. Short links (like spotify.link) can't be checked.`; }
    $('#offerPreview').innerHTML = p ? playerCard({ url: p.url, title: ti.value.trim() || 'Song name', artist: ar.value.trim() || 'Artist', note: note.value }, { embed: false })
        + noteQuote({ title: 1, note: note.value || 'Your note shows here' }, 'Your note')
      : `<div class="placeholder-card">Paste a link to see your song card.</div>`;
    autofill(p);
  };
  link.oninput = note.oninput = ti.oninput = ar.oninput = update; update();
  $$('input[name=mood]').forEach(r => r.onchange = () => (d.mood = r.value));
  $('#offerForm').onsubmit = e => {
    e.preventDefault();
    const err = $('#offerErr');
    if (!parseSongLink(d.link)) return (err.textContent = 'Paste a valid music link first (Spotify, Apple Music, YouTube, SoundCloud and more).');
    if (!d.title.trim()) return (err.textContent = 'Add the song name.');
    if (!d.artist.trim()) return (err.textContent = 'Add the artist.');
    if (hasProfanity(d.title) || hasProfanity(d.artist)) return (err.textContent = 'The song name or artist has a word we filter. Try a clean version of the title.');
    if (d.note.trim().length < 3) return (err.textContent = 'Add a short note about why you picked it.');
    if (hasProfanity(d.note)) return (err.textContent = 'Your note has a word we filter. Rephrase it and try again.');
    if (!d.mood) return (err.textContent = 'Pick the mood that fits.');
    const btn = $('#offerForm button[type=submit]'); btn.disabled = true; btn.textContent = 'Adding…';
    submitSong().catch(ex => { err.textContent = ex.message || 'Could not send your song. Try again.'; btn.disabled = false; btn.textContent = 'Add to the pool'; });
  };
}

  async function pull(mood) {

    const panel = $('#offerPanel'); if (!panel) return;

    let mine;
    try { mine = (await S.store.listWhere(SONGS, 'owner', '==', me())).filter(x => x.status === 'open' && x.owner === me()).sort((a, b) => b.createdAt - a.createdAt); }

      <p class="err" id="offerErr2" role="alert"></p>

      if (!my) return (err.textContent = 'Pick a song to offer.');
      btn.disabled = true; err.textContent = '';
      try {
        await sendOffer(f.song, my);
        f.seen.add(f.song.id); f.song = null; quota();
        $('#offerBtn') && ($('#offerBtn').disabled = true);
        panel.innerHTML = `<div class="panel"><h3>Offer sent</h3><p class="muted" style="margin:6px 0 12px">They'll see your song, not you. You'll get a notification when they answer.</p>

  }

/* ---------- one swap: react to their song, then the reveal ---------- */
async function renderSwap() {
  let pid = S.openPair; if (!pid) { try { pid = sessionStorage.getItem('bs_openpair'); } catch {} }
  const empty = () => { view().innerHTML = `<section class="panel empty">${orb(100)}<h2>No swap open</h2><p class="muted">Accepted swaps live under Swaps. Or find a new song by mood.</p>
    <div class="row" style="justify-content:center"><a class="btn primary" href="#swaps">Go to Swaps</a><a class="btn" href="#find">Find a song</a></div></section>`; };
  if (!pid) return empty();
  if (!S.user.pairIds.includes(pid)) { await syncPairs(); if (!S.user.pairIds.includes(pid)) return empty(); }
  let pair; try { pair = await S.store.get(PAIRS, pid); } catch { pair = null; }
  if (!pair || pair.removed?.[me()] || !pair.users.includes(me())) return empty();
  if (S.route !== 'swap') return;
  S.swap.pair = pair; S.swap.song = pair.songs[me()];
  S.swap.stage = pair.reactions?.[me()] ? 'reveal' : 'receive';
  maybeBotReact(pair);
  return S.swap.stage === 'receive' ? renderReceive() : renderReveal();
}

      await S.store.patch(PAIRS, pair.id, { reactions: { [me()]: r } });
      try { // index the song by mood: my tags + the sender's own mood
        await tagSong(them, moods, me(), 'listener');
        if (moodOf(them.mood)) await tagSong(them, [them.mood], them.owner, 'sender');
        await notify(them.owner, 'reacted', pair.id, 'Your stranger reacted to your song.');
      } catch (ex) { console.warn('mood tagging failed', ex); }
      S.user.stats.reactions++; await commitUser();
      S.swap.pair = await S.store.get(PAIRS, pair.id);
      S.swap.stage = 'reveal'; S.swap.animate = true; render();
    } catch (ex) { err.textContent = 'Could not save your reaction. Try again.'; go.disabled = false; }
  };
}

function reactionHTML(r, label) {

}

/* ---------- formatted reaction text ----------
   Stored as runs: [[text, mask]] where mask bits are 1 bold, 2 italic, 4 underline, 8 strike.
   No HTML is ever stored; rendering escapes the text and adds only these four tags. */
const PICK_EMOJI = ['😂', '😍', '😭', '🤯', '🔥', '💔', '🌙', '✨', '🎧', '🎶', '💃', '🕺', '😌', '😢', '🙌', '👏', '💯', '😴', '🤘', '🌧️', '☕', '🚗', '🌊', '🌸', '💜', '🖤', '😎', '🤔', '👀', '🙏', '🎸', '🥁'];
function richHTML(r) {
  if (Array.isArray(r?.rich) && r.rich.length) {
    return r.rich.slice(0, 60).map(run => {
      let h = esc(String(run?.[0] ?? '')); const m = +run?.[1] | 0;
      if (m & 8) h = `<s>${h}</s>`; if (m & 4) h = `<u>${h}</u>`; if (m & 2) h = `<i>${h}</i>`; if (m & 1) h = `<b>${h}</b>`;
      return h;
    }).join('');
  }
  return esc(r?.comment || '');
}
/** Turns a contenteditable box into a tiny formatted-text editor with an emoji picker. */
function initRichEditor(box, max) {
  const bar = box.parentElement.querySelector('.rte-bar'), pop = box.parentElement.querySelector('.emoji-pop'), ebtn = bar.querySelector('#emojiBtn');
  let saved = null;
  const len = () => box.textContent.length;
  const count = () => { const c = $('#cCtr'); if (c) c.textContent = `${len()}/${max}`; };
  const sync = () => $$('[data-cmd]', bar).forEach(b => { let on = false; try { on = document.queryCommandState(b.dataset.cmd); } catch {} b.setAttribute('aria-pressed', String(!!on)); });
  const keep = () => { const s = getSelection(); if (s.rangeCount && box.contains(s.anchorNode)) saved = s.getRangeAt(0).cloneRange(); };
  document.addEventListener('selectionchange', () => { if (box.isConnected && box.contains(getSelection().anchorNode)) { keep(); sync(); } });
  box.addEventListener('beforeinput', e => {
    if (e.inputType === 'insertParagraph' || e.inputType === 'insertLineBreak') return e.preventDefault();
    if (e.inputType.startsWith('insert') && e.data && len() + e.data.length > max) e.preventDefault();
  });
  box.addEventListener('keydown', e => { if (e.key === 'Enter') e.preventDefault(); });
  box.addEventListener('paste', e => { // plain text only, trimmed to fit
    e.preventDefault();
    const t = (e.clipboardData?.getData('text/plain') || '').replace(/\s+/g, ' ').slice(0, Math.max(0, max - len()));
    if (t) document.execCommand('insertText', false, t);
  });
  box.addEventListener('drop', e => e.preventDefault());
  box.addEventListener('input', () => { if (!box.textContent) box.innerHTML = ''; count(); });
  bar.addEventListener('mousedown', e => { if (e.target.closest('button')) e.preventDefault(); }); // keep the selection in the box
  $$('[data-cmd]', bar).forEach(b => b.onclick = () => { box.focus(); if (saved) { const s = getSelection(); s.removeAllRanges(); s.addRange(saved); } document.execCommand(b.dataset.cmd); sync(); });
  const closePop = () => { pop.hidden = true; ebtn.setAttribute('aria-expanded', 'false'); };
  ebtn.onclick = () => { pop.hidden = !pop.hidden; ebtn.setAttribute('aria-expanded', String(!pop.hidden)); if (!pop.hidden) pop.querySelector('button')?.focus(); };
  pop.addEventListener('mousedown', e => e.preventDefault());
  pop.onclick = e => {
    const b = e.target.closest('[data-ins]'); if (!b) return;
    if (len() + b.dataset.ins.length > max) { closePop(); return; }
    box.focus();
    const s = getSelection();
    if (saved) { s.removeAllRanges(); s.addRange(saved); } else { const r = document.createRange(); r.selectNodeContents(box); r.collapse(false); s.removeAllRanges(); s.addRange(r); }
    document.execCommand('insertText', false, b.dataset.ins); keep(); count(); closePop();
  };
  pop.addEventListener('keydown', e => { if (e.key === 'Escape') { closePop(); ebtn.focus(); } });
  document.addEventListener('click', e => { if (pop.isConnected && !pop.hidden && !pop.contains(e.target) && e.target !== ebtn) closePop(); });
  return {
    /** Serialize the DOM to runs, honoring tags or inline styles the browser may produce. */
    value() {
      const runs = [];
      const push = (t, m) => { if (!t) return; const last = runs[runs.length - 1]; if (last && last[1] === m) last[0] += t; else runs.push([t, m]); };
      const walk = (n, m) => {
        for (const c of n.childNodes) {
          if (c.nodeType === 3) { push(c.data.replace(/\s+/g, ' '), m); continue; }
          if (c.nodeType !== 1) continue;
          if (c.tagName === 'BR') { push(' ', m); continue; }
          const t = c.tagName, st = c.style; let g = m;
          if (/^(B|STRONG)$/.test(t) || st.fontWeight === 'bold' || +st.fontWeight >= 600) g |= 1;
          if (/^(I|EM)$/.test(t) || st.fontStyle === 'italic') g |= 2;
          if (t === 'U' || /underline/.test(st.textDecoration || st.textDecorationLine)) g |= 4;
          if (/^(S|STRIKE|DEL)$/.test(t) || /line-through/.test(st.textDecoration || st.textDecorationLine)) g |= 8;
          walk(c, g);
        }
      };
      walk(box, 0);
      let left = max; const out = [];
      for (const [t, m] of runs) { if (left <= 0) break; const s = t.slice(0, left); left -= s.length; out.push([s, m]); }
      while (out.length && !out[0][0].trim()) out.shift();
      if (out.length) out[0][0] = out[0][0].trimStart();
      if (out.length) out[out.length - 1][0] = out[out.length - 1][0].trimEnd();
      return out.filter(r => r[0]).slice(0, 60);
    },
  };
}

          zone.innerHTML = giftButtonHTML(S.swap.pair); bindGift();
        }
      });
      zone.querySelector('[data-n]:not([disabled])')?.focus();
    };
  };
  bindGift();
}
function giftButtonHTML(pair) {
  const n = giftAmt({ amount: pair.gifts?.[me()] });

function giftInText(pair, who) {

}

      <span class="note-ic" aria-hidden="true">📨</span>
      <span class="note-body"><b>You offered “${esc(o.offerSong?.title || 'a song')}” for “${esc(o.targetSong?.title || 'a song')}”</b>
        <small>${esc(timeAgo(o.at))}</small></span>
      <span class="pill ${s.c}">${esc(s.l)}</span>${s.act || ''}</div>`; }).join('');
  return {
    html: `<div class="note-list" style="max-width:none">${html}</div>`,
    bind(box, reload) {
      box.onclick = async e => {
        const o1 = e.target.closest('[data-open]'); if (o1) return openSwap(o1.dataset.open);
        const w = e.target.closest('[data-wd]'); if (!w) return;
        const o = list.find(x => x.id === w.dataset.wd); if (!o) return;

        try { await withdrawOffer(o); toast('Offer withdrawn.'); await refreshCounts(false); reload(); } catch { toast('Could not withdraw that. Try again.'); w.disabled = false; }
      };
    },
  };
}

/* My songs: everything I submitted, and where it stands. */
async function tabSongs() {

  const head = `<div class="row" style="margin-bottom:18px;justify-content:space-between"><span class="tag quota"><b>${todayCount(S.user)}</b>/${DAILY_MAX} submitted today</span><a class="btn small primary" href="#submit">Submit a song</a></div>`;
  if (!mine.length) return { html: head + emptyPanel('No songs yet', 'Submit a song with a mood and it goes into the pool for strangers to pull.', '<a class="btn primary" href="#submit">Submit a song</a>') };
  const html = mine.map(s => {
    const n = S.offersIn.filter(o => isLive(o) && o.targetSongId === s.id).length;
    const status = s.status === 'paired' ? `<span class="pill ok">Swapped</span>` : `<span class="pill wait">In the pool</span>`;

      </div></article>`;
  }).join('');
  return {

/* ---------- find by mood ---------- */
async function renderMoods() {
  const cur = moodOf(S.moodPick) ? S.moodPick : MOODS[0].k;
  view().innerHTML = `<p class="eyebrow">Find by mood</p>
    <h1 style="font-size:clamp(2rem,5vw,2.8rem);margin-top:6px">What fits right now?</h1>
    <p class="muted" style="margin-top:8px;max-width:58ch">Listeners tag every song they get in a swap. Pick a mood to see the songs strangers felt that way about, most-tagged first.</p>
    <fieldset style="margin-top:18px"><legend class="sr">Mood</legend><div class="chips" id="moodPick">
      ${MOODS.map(m => `<label class="chip" style="margin:0;font-weight:500"><input type="radio" name="mp" value="${m.k}"${m.k === cur ? ' checked' : ''}><span>${m.i} ${m.l}</span></label>`).join('')}
    </div></fieldset>
    <div id="moodRes" class="mood-res" aria-live="polite"><p class="muted">Looking through the crates…</p></div>`;
  $$('input[name=mp]').forEach(r => r.onchange = () => { S.moodPick = r.value; load(r.value); });
  async function load(mood) {
    const box = $('#moodRes'); if (!box) return;
    box.innerHTML = '<p class="muted">Looking through the crates…</p>';
    let tags;
    try { tags = await S.store.listTagged(mood); } catch { box.innerHTML = '<p class="err">Could not load songs for that mood. Try again.</p>'; return; }
    if (S.moodPick && S.moodPick !== mood && S.route === 'moods') return; // a newer pick is loading
    const groups = new Map();
    for (const t of tags) {
      if (!t || !parseSongLink(t.url)) continue;
      // The same song from different services counts as one when the name and artist match.
      const gk = t.title && t.artist ? `t:${t.title.trim().toLowerCase()}|${t.artist.trim().toLowerCase()}` : t.key;
      const g = groups.get(gk) || { url: t.url, title: '', artist: '', note: '', votes: 0, last: 0 };
      g.votes++; g.last = Math.max(g.last, +t.at || 0);
      if (!g.title && t.title) { g.title = t.title; g.artist = t.artist; }
      if (!g.note && t.note) g.note = t.note;
      groups.set(gk, g);
    }
    const list = [...groups.values()].sort((a, b) => b.votes - a.votes || b.last - a.last).slice(0, 30);
    const m = moodOf(mood);
    if (!list.length) {
      box.innerHTML = `<div class="panel empty" style="grid-column:1/-1">${orb(90)}<h2>No ${esc(m.l.toLowerCase())} songs yet</h2><p class="muted">Songs show up here once someone tags them after a swap.</p><a class="btn primary" href="#find">Find a song</a></div>`;
      return;
    }
    box.innerHTML = list.map(g => `<article class="mood-item">
      ${playerCard({ url: g.url, title: g.title, artist: g.artist, note: g.note }, { tag: m.l.toUpperCase(), embed: false })}
      <p class="hint" style="margin:0">${m.i} Tagged ${esc(m.l.toLowerCase())} ${g.votes} time${g.votes === 1 ? '' : 's'}</p>
    </article>`).join('');
  }
  load(cur);
}

/* ---------- notifications (Matches) + direct messages (Inbox) ----------
   Notes: bs_notes/<id> {to, type, pairId, text, at}. Unread = newer than user.notesSeenAt.
   Messages: bs_msgs/<id> {pairId, users, from, text, at}. Unread = newer than user.readAt[pairId].
   DMs only open once BOTH people have reacted (the seal is broken both ways) and neither blocked. */
const NOTE_ICON = { match: '🛸', accepted: '🛸', offer: '📨', declined: '🚫', friend: '🤝', reacted: '🎧', thanks: '💌', gift: '📼', message: '✉️' };

/* ---------- Cassettes: the in-app currency ----------
   Balance = 10 to start + 1 per song you react to + cassettes received − cassettes given.
   Every gift is a ledger doc bs_gifts/<id> {from, to, amount, pairId, at}, so nobody's client
   ever edits another person's balance; it's always recomputed from the ledger. */
const CASSETTE_START = 10, GIFT_AMOUNTS = [1, 3, 5];
const giftAmt = g => Math.max(0, Math.min(5, Math.floor(+g?.amount || 0)));
function cassettes(u = S.user, gin = S.giftsIn, gout = S.giftsOut) {
  if (!u) return 0;
  return CASSETTE_START + (u.stats.reactions || 0) + gin.reduce((a, g) => a + giftAmt(g), 0) - gout.reduce((a, g) => a + giftAmt(g), 0);
}
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
async function giveCassettes(pair, n, from = me()) {
  const to = pair.users.find(x => x !== from), id = uid('g_');
  await S.store.put(GIFTS, id, { id, from, to, amount: n, pairId: pair.id, at: Date.now() });
  await S.store.patch(PAIRS, pair.id, { gifts: { [from]: n } });
  await notify(to, 'gift', pair.id, `Your stranger gave you ${plural(n, 'cassette')} for your song.`);
}
const BOT_REPLIES = ['Glad the song found you.', 'Ha, I had a feeling you would like it.', 'Okay, I need more songs like the one you sent.', 'First time a stranger got my taste this right.'];
const isBotName = n => n === 'test_stranger' || String(n || '').startsWith('bot_');
function canMessage(p) { return !!p && p.users.every(x => p.reactions?.[x]) && !Object.values(p.removed || {}).some(Boolean); }
async function notify(to, type, pairId, text) {
  if (!to || isBotName(to)) return;
  const id = uid('n_');
  try { await S.store.put(NOTES, id, { id, to, type, pairId, text: String(text).slice(0, 140), at: Date.now() }); } catch (e) { console.warn('notify failed', e); }
}
function timeAgo(t) {
  const s = Math.max(0, (Date.now() - t) / 1000);
  if (s < 60) return 'just now'; if (s < 3600) return `${Math.floor(s / 60)}m ago`; if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
  return new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}
/** Polls notes + messages (every 12 s while logged in), updates header badges, toasts new arrivals. */
async function refreshCounts(toastNew = false) {
  if (!S.user) return;
  try {
    const q = (col, f, op, v) => S.store.listWhere(col, f, op, v);
    const [notes, msgs, gin, gout, oin, oout, fr] = await Promise.all([q(NOTES, 'to', '==', me()), q(MSGS, 'users', 'array-contains', me()),
      q(GIFTS, 'to', '==', me()), q(GIFTS, 'from', '==', me()), q(OFFERS, 'to', '==', me()), q(OFFERS, 'from', '==', me()), q(FRIENDS, 'users', 'array-contains', me())]);
    if (!S.user) return;
    S.giftsIn = gin.filter(g => g && g.to === me()); S.giftsOut = gout.filter(g => g && g.from === me());
    S.offersIn = oin.filter(o => o && o.to === me()); S.offersOut = oout.filter(o => o && o.from === me());
    S.friends = fr.filter(f => f && Array.isArray(f.users) && f.users.includes(me()));
    S.notes = notes.filter(n => n && n.to === me()).sort((a, b) => b.at - a.at);
    S.msgs = msgs.filter(m => m && Array.isArray(m.users) && m.users.includes(me()));
    await syncPairs();
    const rd = S.user.readAt || {};
    S.counts = {
      notes: S.notes.filter(n => n.at > (S.user.notesSeenAt || 0)).length,
      msgs: S.msgs.filter(m => m.from !== me() && m.at > (rd[m.pairId] || 0)).length,
      reqs: S.offersIn.filter(isLive).length,
      todo: S.pairs.filter(p => !p.reactions?.[me()] && !p.removed?.[me()]).length,
      fr: S.friends.filter(f => f.status === 'pending' && f.from !== me()).length,
    };
    if (toastNew) S.notes.filter(n => n.at > (S.lastNoteAt || 0)).slice(0, 2).forEach(n => toast(`${NOTE_ICON[n.type] || '🔔'} ${n.text}`));
    S.lastNoteAt = Math.max(S.lastNoteAt || 0, ...S.notes.map(n => n.at));
    renderWho();
    document.dispatchEvent(new Event('bs-counts'));
    if (S.offersOut.some(o => isLive(o) && isBotName(o.to))) resolveBotOffers();   // sample strangers answer (also after a refresh)
  } catch (e) { console.warn('could not refresh notifications', e); }
}
async function sendMessage(pair, text) {
  const id = uid('m_');
  await S.store.put(MSGS, id, { id, pairId: pair.id, users: pair.users, from: me(), text, at: Date.now() });
  await notify(partnerOf(pair), 'message', pair.id, `New message from ${pair.songs[me()]?.displayName || 'your stranger'}`);
  if (pair.bot) { // sample/test strangers answer once in a while so the inbox can be tested solo
    setTimeout(async () => {
      try {
        const rid = uid('m_');
        await S.store.put(MSGS, rid, { id: rid, pairId: pair.id, users: pair.users, from: pair.bot, text: pick(BOT_REPLIES), at: Date.now() });
        await notify(me(), 'message', pair.id, `New message from ${pair.songs[pair.bot]?.displayName || 'your stranger'}`);
        refreshCounts(false);
      } catch {}
    }, 2500 + Math.random() * 2500);
  }
}

const ANIMALS = ['🐱', '🐰', '🐻', '🦊', '🐸', '🐹', '🐼', '🐥', '🦄', '🐧'];
const animalOf = s => ANIMALS[[...String(s || '?')].reduce((n, c) => n + c.charCodeAt(0), 0) % ANIMALS.length];

      <section class="thread" aria-label="Conversation">${p ? `

    $('#tProf').onclick = () => { S.inboxPair = p.id; openPerson(p.id); };
    $('#tBlock').onclick = () => {
      $('#tConfirm').innerHTML = `<div class="confirm" style="margin:12px 16px 0" role="alert"><span>Report and block this stranger? You won't see this conversation again, and they can't message you.</span>
        <button class="btn small danger" id="bYes" type="button">Report & block</button><button class="btn small" id="bNo" type="button">Cancel</button></div>`;
      $('#bNo').onclick = () => ($('#tConfirm').innerHTML = '');
      $('#bYes').onclick = async () => {
        try {
          await S.store.report({ id: uid('r_'), pairId: p.id, reporter: me(), reported: other, kind: 'messages', recent: msgsFor(p.id).filter(m => m.from === other).slice(-5).map(m => m.text), at: Date.now() });
          await S.store.patch(PAIRS, p.id, { removed: { [me()]: true } });
          pairs = pairs.filter(x => x.id !== p.id); cur = S.inboxPair = null; toast('Reported and blocked.');
          pairs.length ? draw() : renderInbox();
        } catch { toast('Could not block right now. Try again.'); }
      };
    };
    const inp = $('#msgIn'), pop = $('#msgPop'), eb = $('#msgEmoji');
    eb.onclick = () => { pop.hidden = !pop.hidden; eb.setAttribute('aria-expanded', String(!pop.hidden)); };
    pop.onclick = e => {
      const bt = e.target.closest('[data-ins]'); if (!bt || inp.value.length + bt.dataset.ins.length > 300) return;
      const s = inp.selectionStart ?? inp.value.length, en = inp.selectionEnd ?? s;
      inp.value = inp.value.slice(0, s) + bt.dataset.ins + inp.value.slice(en); inp.focus(); inp.setSelectionRange(s + bt.dataset.ins.length, s + bt.dataset.ins.length);
      pop.hidden = true; eb.setAttribute('aria-expanded', 'false');
    };
    inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#msgForm').requestSubmit(); } });
    $('#msgForm').onsubmit = async e => {
      e.preventDefault();
      const err = $('#msgErr'), text = inp.value.trim().slice(0, 300);
      err.textContent = '';
      if (!text) return;
      if (hasProfanity(text)) return (err.textContent = 'That message has a word we filter. Rephrase it and try again.');
      const fresh = await S.store.get(PAIRS, p.id).catch(() => p);
      if (!canMessage(fresh)) return (err.textContent = "This conversation is closed.");
      $('#msgSend').disabled = true;
      try { await sendMessage(p, text); inp.value = ''; await refreshCounts(false); shownSig = S.msgs.length; draw(); $('#msgIn')?.focus(); }
      catch { err.textContent = 'Could not send. Try again.'; }
      finally { const s = $('#msgSend'); if (s) s.disabled = false; }
    };
  }
  draw();
  // keep the open conversation fresh without re-rendering the composer
  let shownSig = S.msgs.length; // compare against what's on screen, not the last poll (others poll too)
  S.timers.push(setInterval(async () => {
    if (S.route !== 'inbox') return;
    await refreshCounts(false);
    if (S.msgs.length === shownSig) return;
    shownSig = S.msgs.length;
    const ml = $('#msgs'), inp = $('#msgIn');
    if (cur && ml) {
      ml.innerHTML = msgsFor(cur).map(msgHTML).join(''); ml.scrollTop = ml.scrollHeight; markRead(cur);
      $$('.conv', box).forEach(b => { if (b.dataset.p !== cur) return; const ms = msgsFor(cur), last = ms[ms.length - 1]; const l = b.querySelector('.conv-last'); if (l && last) l.textContent = (last.from === me() ? 'You: ' : '') + last.text; });
    } else if (!inp) draw();
  }, 4000));
}

/* ---------- profile (MySpace-style) ---------- */
const pad6 = n => String(Math.max(0, n | 0)).padStart(6, '0');
const SPARKS = [[6, 8], [88, 5], [40, 3], [72, 22], [14, 38], [94, 44], [55, 52], [4, 66], [80, 70], [30, 82], [66, 90], [92, 94], [20, 14], [48, 30]];
const clamp01 = v => Math.max(0, Math.min(1, Number.isFinite(+v) ? +v : 0.5));
const gradCss = t => `linear-gradient(160deg,${isHex(t.c1) ? t.c1 : '#3a1630'},${isHex(t.c2) ? t.c2 : '#0d0a12'})`;
function profileBg(t, media) {
  const bg = safeImg(media?.bg);
  return t.bgMode === 'image' && bg ? `url('${bg.data}') center/cover no-repeat,${gradCss(t)}` : gradCss(t);
}
/** Size of an image "covering" a square box at zoom z, as multiples of the box. */
function coverDims(w, h, z) { const a = (w || 1) / (h || 1); return a >= 1 ? { W: a * z, H: z } : { W: z, H: z / a }; }
/** CSS that shows a cropped image inside a box. Used by the cropper AND for GIF avatars (keeps animation). */
function coverCss(url, w, h, c = {}) {
  const z = Math.max(1, Math.min(4, +c.z || 1)), { W, H } = coverDims(w, h, z);
  return `background-image:url('${url}');background-size:${(W * 100).toFixed(2)}% ${(H * 100).toFixed(2)}%;background-position:${(clamp01(c.ox) * 100).toFixed(2)}% ${(clamp01(c.oy) * 100).toFixed(2)}%`;
}
/** Avatar (uploaded image, or an initial on your profile colors) inside the chosen frame. */
function avatarHTML(u, p, media, size = 84) {

    : `<span class="av-img" style="background:${gradCss(t)}">${esc((u.username || '?')[0].toUpperCase())}</span>`;
  return `<span class="avf fr-${f}" style="--sz:${size}px" role="img" aria-label="@${esc(u.username)}'s profile picture">${inner}${(FRAMES[f].deco || []).map((d, i) => `<i class="fd fd${i}" aria-hidden="true">${d}</i>`).join('')}</span>`;
}

}

/* Image helpers for the uploaders. */
const readDataURL = f => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(new Error('Could not read that file.')); r.readAsDataURL(f); });
const loadImg = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("That file isn't an image this browser can open.")); i.src = src; });
/** Draw onto a canvas and export at the first format/quality that fits under maxBytes. */
function bakeImage(w, h, draw, maxBytes) {
  for (const [type, q] of [['image/webp', 0.86], ['image/webp', 0.7], ['image/jpeg', 0.82], ['image/jpeg', 0.62], ['image/jpeg', 0.45]]) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const x = c.getContext('2d');
    if (type === 'image/jpeg') { x.fillStyle = '#111'; x.fillRect(0, 0, w, h); }
    draw(x);
    const d = c.toDataURL(type, q);
    if (d.startsWith('data:' + type) && d.length * 0.75 <= maxBytes) return d;
  }
  return null;
}
function checkFile(input) {
  const f = input.files?.[0]; input.value = '';
  if (!f) return null;
  if (!IMG_TYPES.includes(f.type)) throw new Error('Use a PNG, JPG, WebP or GIF file.');
  if (f.size > 15 * 1024 * 1024) throw new Error('That file is over 15 MB. Pick a smaller one.');
  return f;
}

function osMake(id) {

    if (e.target.closest('.win-btn') || rec.el.classList.contains('max') || isPhone()) return;
    const el = rec.el, sx = e.clientX, sy = e.clientY, ox = el.offsetLeft, oy = el.offsetTop;
    rec.tb.setPointerCapture(e.pointerId);
    const mv = ev => { const D = deskEl(); el.style.left = Math.max(90 - el.offsetWidth, Math.min(D.clientWidth - 90, ox + ev.clientX - sx)) + 'px'; el.style.top = Math.max(0, Math.min(D.clientHeight - 32, oy + ev.clientY - sy)) + 'px'; };
    const up = () => { rec.tb.removeEventListener('pointermove', mv); rec.tb.removeEventListener('pointerup', up); rec.tb.removeEventListener('pointercancel', up); };
    rec.tb.addEventListener('pointermove', mv); rec.tb.addEventListener('pointerup', up); rec.tb.addEventListener('pointercancel', up);

    const el = rec.el, sx = e.clientX, sy = e.clientY, ow = el.offsetWidth, oh = el.offsetHeight;

function osPlace(rec) {
  const D = deskEl(), a = rec.app, W = D.clientWidth, H = D.clientHeight;

    root.querySelectorAll('[data-pixc]').forEach(i => { const hk = i.dataset.pixc, k = i.dataset.for, lab = i.parentElement, on = !!p.pix[hk]; lab.classList.toggle('on', on); lab.style.background = on ? p.pix[hk] : ''; i.value = p.pix[hk] || ARR[k][p.pix[k]]; });
  };
  const save = () => { u.profile.pix = { ...p.pix }; clearTimeout(t); t = setTimeout(() => { S.store.putUser(u).catch(() => {}); }, 700); };
  root.addEventListener('click', e => {
    const b = e.target.closest('[data-pix]');
    if (b) { const k = b.dataset.pix; p.pix[k] = ['skin', 'hairCol', 'outfitCol', 'eyeCol', 'frameCol', 'trimCol'].includes(k) ? +b.dataset.v : b.dataset.v; if (HX[k]) delete p.pix[HX[k]]; refresh(); save(); return; }
    if (e.target.closest('#pxRand')) { p.pix = normalizePix(randomPix()); refresh(); save(); }
  });
  root.addEventListener('input', e => { const i = e.target.closest('[data-pixc]'); if (!i) return; p.pix[i.dataset.pixc] = i.value.toLowerCase(); refresh(); save(); });
  const onMode = () => { if (!root.isConnected) return window.removeEventListener('rr-mode', onMode); refresh(); };
  window.addEventListener('rr-mode', onMode);
