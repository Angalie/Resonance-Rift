  refresh();
}
const pxZoom = (view, dir) => {
  let z = +view.dataset.z || 1; z = dir === 'in' ? Math.min(4, z + 1) : dir === 'out' ? Math.max(1, z - 1) : (z >= 4 ? 1 : z + 1);
  view.dataset.z = String(z); view.style.setProperty('--z', String(z)); const l = view.querySelector('.pxd-zl'); if (l) l.textContent = z + '×';
};
document.addEventListener('click', e => { const zb = e.target.closest('[data-zoom]'); if (zb) pxZoom(zb.closest('.pxd-view'), zb.dataset.zoom); });
document.addEventListener('dblclick', e => { const img = e.target.closest('.pxd-room'); if (img) pxZoom(img.closest('.pxd-view'), 'step'); });
document.addEventListener('click', e => {
  const b = e.target.closest('.pxd-b'); if (!b) return;
  const go = sel => { const el = document.querySelector(sel); el?.scrollIntoView({ behavior: 'smooth', block: 'center' }); return el; };
  switch (b.dataset.act) {
    case 'status': { const el = go('#pf-status'); el?.focus({ preventScroll: true }); break; }
    case 'find': location.hash = '#find'; break;
    case 'song': location.hash = '#submit'; break;
    case 'badges': go('.badges'); break;
    case 'style': go('#pixEd'); break;
    case 'sleep': setMode(currentMode() === 'night' ? 'light' : 'night', true); break;
  }
});

/* ---- Profile completion checklist ---- */
function pTab(name) {
  S.ptab = name; try { localStorage.setItem('rr_ptab', name); } catch {}
  document.querySelectorAll('[data-ptabp]').forEach(el => { el.hidden = el.dataset.ptabp !== name; });
  document.querySelectorAll('.ptabs [data-ptab]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.ptab === name)));
}
function checkWire(u, p, dm, read) {
  const root = document.getElementById('checkPanel'); if (!root) return;
  let saved = S.ptab; if (!saved) { try { saved = localStorage.getItem('rr_ptab'); } catch {} }
  pTab(saved === 'tasks' ? 'tasks' : 'profile');
  document.querySelector('.ptabs')?.addEventListener('click', e => { const b = e.target.closest('[data-ptab]'); if (b) pTab(b.dataset.ptab); });
  const def = JSON.stringify(normalizePix(null));
  const items = () => {
    const s = u.stats || {}, t = p.theme || {}, tops = (p.top8 || []).filter(v => parseSongLink(v)).length;
    return [
      { t: 'Add a profile picture', d: !!dm.avatar, go: '#avNow' },
      { t: 'Style your pixel avatar', d: JSON.stringify(normalizePix(p.pix)) !== def, go: '#pixEd' },
      { t: 'Write a short bio', d: fmtPlain(p.bio).trim().length >= 10, go: '#pf-bio' },
      { t: 'Set your status', d: !!(p.status && p.status.text.trim()), go: '#pf-status' },
      { t: 'Pick a profile song', d: !!parseSongLink(p.profileSong), go: '#pf-song' },
      { t: 'Fill three Top 8 slots', d: tops >= 3, go: '#pf-t0' },
      { t: 'Choose a frame or nametag', d: t.frame !== 'ring' || t.nametag !== 'plain', go: '#framePick' },
      { t: 'Submit your first song', d: (s.submitted || 0) >= 1, go: '#submit' },
      { t: 'Finish your first swap', d: (s.matches || 0) >= 1, go: '#swaps' },
      { t: 'Earn a badge', d: (u.badges || []).length >= 1, go: '#badges' },
    ];
  };
  const draw = () => {
    try { read(); } catch {}
    const list = items(), n = list.filter(i => i.d).length, pct = Math.round((n / list.length) * 100);
    root.querySelector('.ck-pct').textContent = pct + '%';
    const tc = document.getElementById('taskCount'); if (tc) tc.textContent = n + '/' + list.length;
    const bar = root.querySelector('.ck-bar'); bar.setAttribute('aria-valuenow', String(pct)); bar.firstChild.style.width = Math.max(4, pct) + '%';
    root.querySelector('.ck-sub').textContent = n === list.length ? 'All done. Your profile is complete ♥' : n + ' of ' + list.length + ' done';
    root.querySelector('.ck-list').innerHTML = list.map(i => '<li class="' + (i.d ? 'done' : '') + '"><span class="ck-box" aria-hidden="true">' + (i.d ? '✓' : '') + '</span><span class="ck-t">' + esc(i.t) + (i.d ? '<span class="sr"> (done)</span>' : '') + '</span>' + (i.d ? '' : '<button type="button" class="ck-go" data-go="' + esc(i.go) + '">Go</button>') + '</li>').join('');
  };
  root.addEventListener('click', e => {
    const b = e.target.closest('.ck-go'); if (!b) return; const g = b.dataset.go;
    if (g === '#submit' || g === '#swaps') { location.hash = g; return; }
    pTab('profile');   // the thing to fix lives on the Profile tab
    const el = g === '#badges' ? document.querySelector('.badges') : document.querySelector(g);
    el?.scrollIntoView({ behavior: 'smooth', block: 'center' });
    if (el && /^(INPUT|TEXTAREA|SELECT|BUTTON)$/.test(el.tagName)) el.focus({ preventScroll: true });
  });
  ['input', 'change', 'click'].forEach(ev => document.getElementById('view').addEventListener(ev, () => setTimeout(draw, 60)));
  S.timers.push(setInterval(draw, 2000));
  draw();
}

/* ---- Text formatting for the profile bio and About me: **bold**, *italic*, __underline__, ~~strike~~ (safe: text is escaped first, only these tags are produced) ---- */
function fmt(s, block) {
  let t = esc(String(s || ''));
  t = t.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>').replace(/~~(.+?)~~/g, '<s>$1</s>').replace(/\*(.+?)\*/g, '<i>$1</i>');
  return block ? t.split('\n').join('<br>') : t;
}
const fmtPlain = s => String(s || '').replace(/\*\*|__|~~|\*/g, '');
function fmtBar(id, bullets) {
  return '<div class="fmt-bar" data-for="' + id + '" role="toolbar" aria-label="Formatting"><button type="button" data-f="b" title="Bold" aria-label="Bold"><b>B</b></button><button type="button" data-f="i" title="Italic" aria-label="Italic"><i>I</i></button><button type="button" data-f="u" title="Underline" aria-label="Underline"><u>U</u></button><button type="button" data-f="s" title="Strikethrough" aria-label="Strikethrough"><s>S</s></button><button type="button" data-f="emoji" title="Insert emoji" aria-label="Insert emoji" aria-haspopup="dialog">😊</button>' +
    (bullets ? '<button type="button" data-f="bullet" title="Bullet point" aria-label="Bullet point">•</button>' : '') + '<button type="button" data-f="clear" title="Clear formatting" aria-label="Clear formatting">Tx</button></div>';
}
function fmtApply(f, id, btn, text) {
  const el = document.getElementById(id); if (!el) return; el.focus();
  const a = el.selectionStart, b = el.selectionEnd, v = el.value, sel = v.slice(a, b), T = { b: '**', i: '*', u: '__', s: '~~' };
  let ins, ns, ne;
  if (T[f]) { const m = T[f]; ins = m + sel + m; ns = a + m.length; ne = ns + sel.length; }
  else if (f === 'bullet') { ins = (a === 0 || v[a - 1] === '\n' ? '' : '\n') + '• ' + sel; ns = ne = a + ins.length; }
  else if (f === 'insert') { ins = text; ns = ne = a + ins.length; }
  else if (f === 'clear') {
    if (!sel) { el.value = fmtPlain(v); el.dispatchEvent(new Event('input', { bubbles: true })); return; }
    ins = fmtPlain(sel); ns = a; ne = a + ins.length;
  } else if (f === 'emoji') { openEmojiPop(btn, e => fmtApply('insert', id, null, e)); return; }
  else return;
  el.setRangeText(ins, a, b, 'end'); el.setSelectionRange(ns, ne);
  el.dispatchEvent(new Event('input', { bubbles: true }));
}
/** A floating emoji picker (same tabs as Notepad's) placed next to a button. */
function openEmojiPop(anchor, onPick) {
  document.getElementById('fmtEmoji')?.remove();
  const pop = document.createElement('div'); pop.id = 'fmtEmoji'; pop.className = 'emo-pop emo-float'; pop.setAttribute('role', 'dialog'); pop.setAttribute('aria-label', 'Emoji picker');
  const cats = ['Favourites', ...Object.keys(EMO_CATS).filter(c => c !== 'All'), 'All'];
  pop.innerHTML = '<div class="np-etabs" role="tablist">' + cats.map(c => '<button type="button" class="np-et" data-cat="' + c + '">' + c + '</button>').join('') + '</div><div class="np-eg" role="listbox" aria-label="Emoji"></div>';
  document.body.append(pop);
  const r = anchor.getBoundingClientRect(), W = Math.min(380, innerWidth - 16), H = 280;
  pop.style.width = W + 'px'; pop.style.left = Math.max(8, Math.min(innerWidth - W - 8, r.left)) + 'px';
  pop.style.top = (r.bottom + 6 + H > innerHeight ? Math.max(8, r.top - 6 - H) : r.bottom + 6) + 'px';
  const show = cat => {
    pop.querySelectorAll('.np-et').forEach(t => t.classList.toggle('on', t.dataset.cat === cat));
    const list = cat === 'Favourites' ? STATUS_EMOJI : emojiList(cat), g = pop.querySelector('.np-eg');
    g.innerHTML = list.map(e => '<button type="button" data-e="' + esc(e) + '">' + esc(e) + '</button>').join(''); g.scrollTop = 0;
  };
  const close = () => { pop.remove(); document.removeEventListener('pointerdown', away, true); document.removeEventListener('keydown', key, true); };
  const away = ev => { if (!ev.target.closest('#fmtEmoji') && ev.target !== anchor) close(); };
  const key = ev => { if (ev.key === 'Escape') { ev.preventDefault(); close(); anchor.focus(); } };
  pop.onclick = ev => { const t = ev.target.closest('.np-et'), b = ev.target.closest('[data-e]'); if (t) return show(t.dataset.cat); if (b) { onPick(b.dataset.e); close(); } };
  document.addEventListener('pointerdown', away, true); document.addEventListener('keydown', key, true);
  show('Favourites');
}
function fmtWire() {
  const form = document.getElementById('pfForm'); if (!form) return;
  const upd = () => [['pf-bio', 'bioCtr', 80], ['pf-about', 'aboutCtr', 400]].forEach(([id, cid, max]) => {
    const el = document.getElementById(id), c = document.getElementById(cid); if (!el || !c) return;
    const n = fmtPlain(el.value).length; c.textContent = n + '/' + max; c.classList.toggle('over', n > max);
  });
  form.addEventListener('click', e => { const b = e.target.closest('.fmt-bar [data-f]'); if (b) fmtApply(b.dataset.f, b.closest('.fmt-bar').dataset.for, b); });
  form.addEventListener('keydown', e => {
    if (!(e.ctrlKey || e.metaKey) || !['pf-bio', 'pf-about'].includes(e.target.id)) return;
    const f = { b: 'b', i: 'i', u: 'u' }[e.key.toLowerCase()]; if (f) { e.preventDefault(); fmtApply(f, e.target.id); }
  });
  form.addEventListener('input', upd); upd();
}

/* Sticky notes on the desktop exist only when the user pins them from Notepad (kept on this device). */
const PINS_KEY = 'rr_pins';
function pinsLoad() { try { return JSON.parse(localStorage.getItem(PINS_KEY) || '[]').filter(p => p && typeof p.text === 'string').slice(0, 4); } catch { return []; } }
function pinsSave(a) { try { localStorage.setItem(PINS_KEY, JSON.stringify(a)); } catch {} }
function pinsRender() {
  const box = document.getElementById('stickies'), D = deskEl(), pins = pinsLoad();
  box.innerHTML = pins.map((p, i) => {
    const x = p.x != null ? p.x : Math.max(10, D.clientWidth - 160 - (i % 3) * 140), y = p.y != null ? p.y : Math.max(10, D.clientHeight - 130 - Math.floor(i / 3) * 100);
    return '<span class="sticky c' + (i % 2) + '" data-i="' + i + '" style="left:' + x + 'px;top:' + y + 'px"><b>' + esc(p.text) + '</b><button type="button" class="unpin" aria-label="Unpin note">✕</button></span>';
  }).join('');
}
function pinsDrag(e) {
  const el = e.target.closest('.sticky'); if (!el || e.target.closest('.unpin')) return;
  const D = deskEl(), sx = e.clientX, sy = e.clientY, ox = el.offsetLeft, oy = el.offsetTop; let moved = false;
  el.setPointerCapture(e.pointerId); el.style.cursor = 'grabbing';
  const mv = ev => { moved = true; el.style.left = Math.max(0, Math.min(D.clientWidth - el.offsetWidth, ox + ev.clientX - sx)) + 'px'; el.style.top = Math.max(0, Math.min(D.clientHeight - el.offsetHeight, oy + ev.clientY - sy)) + 'px'; };
  const up = () => {
    el.removeEventListener('pointermove', mv); el.removeEventListener('pointerup', up); el.removeEventListener('pointercancel', up); el.style.cursor = '';
    if (!moved) return;
    const a = pinsLoad(), p = a[+el.dataset.i]; if (p) { p.x = el.offsetLeft; p.y = el.offsetTop; pinsSave(a); }
  };
  el.addEventListener('pointermove', mv); el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
}
function osInit() {
  pinsRender();
  document.getElementById('stickies').addEventListener('pointerdown', pinsDrag);
  document.getElementById('stickies').addEventListener('click', e => { const b = e.target.closest('.unpin'); if (!b) return; const a = pinsLoad(); a.splice(+b.parentElement.dataset.i, 1); pinsSave(a); pinsRender(); });
  document.body.classList.add('os');
  const icons = document.getElementById('dicons');
  // icons can be dragged anywhere on the desktop; their places are remembered on this device
  const ICON_KEY = 'rr_icons';
  const iconSaved = () => { try { return JSON.parse(localStorage.getItem(ICON_KEY) || '{}') || {}; } catch { return {}; } };
  const iconsLayout = () => {
    const D = deskEl(), saved = iconSaved(), per = Math.max(1, Math.floor((D.clientHeight - 16) / 96));
    icons.querySelectorAll('.dicon').forEach((b, i) => {
      const s = saved[b.dataset.app] || {}, x = Number.isFinite(s.x) ? s.x : 8 + Math.floor(i / per) * 96, y = Number.isFinite(s.y) ? s.y : 8 + (i % per) * 96;
      b.style.left = Math.max(0, Math.min(D.clientWidth - b.offsetWidth, x)) + 'px'; b.style.top = Math.max(0, Math.min(D.clientHeight - b.offsetHeight, y)) + 'px';
    });
  };
  iconsRefresh = () => { icons.innerHTML = Object.entries(OS.apps).filter(([k]) => appInstalled(k)).map(([k, a]) => `<button type="button" class="dicon" data-app="${k}"><img alt="" src="${ICO[a.icon]}"><span>${esc(a.label)}</span></button>`).join(''); iconsLayout(); };
  iconsRefresh(); window.addEventListener('resize', iconsLayout);
  let dragged = false;
  icons.addEventListener('pointerdown', e => {
    const b = e.target.closest('.dicon'); if (!b) return;
    if (e.button > 0) return;
    const D = deskEl(), sx = e.clientX, sy = e.clientY, ox = b.offsetLeft, oy = b.offsetTop, id = e.pointerId; let moved = false;
    const mv = ev => {
      if (ev.pointerId !== id) return;
      if (!moved && Math.hypot(ev.clientX - sx, ev.clientY - sy) < 3) return;
      if (!moved) { moved = true; b.classList.add('drag'); b.style.zIndex = 5; try { b.setPointerCapture(id); } catch {} }
      ev.preventDefault();
      b.style.left = Math.max(0, Math.min(D.clientWidth - b.offsetWidth, ox + ev.clientX - sx)) + 'px'; b.style.top = Math.max(0, Math.min(D.clientHeight - b.offsetHeight, oy + ev.clientY - sy)) + 'px';
    };
    const up = ev => {
      if (ev.pointerId !== id) return;
      window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up);
      b.classList.remove('drag'); b.style.zIndex = '';
      if (!moved) return;
      dragged = true; setTimeout(() => { dragged = false; }, 80);
      const s = iconSaved(); s[b.dataset.app] = { x: b.offsetLeft, y: b.offsetTop }; try { localStorage.setItem(ICON_KEY, JSON.stringify(s)); } catch {}
    };
    window.addEventListener('pointermove', mv, { passive: false }); window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
  });
  icons.addEventListener('click', e => { if (dragged) { e.stopImmediatePropagation(); e.preventDefault(); } }, true);
  icons.addEventListener('click', e => {
    const b = e.target.closest('.dicon'); if (!b) return;
    icons.querySelectorAll('.dicon').forEach(x => x.classList.toggle('sel', x === b));
    if (e.detail === 0 || e.pointerType === 'touch' || isPhone()) osLaunch(b.dataset.app);
  });
  icons.addEventListener('dblclick', e => { const b = e.target.closest('.dicon'); if (b) osLaunch(b.dataset.app); });
  deskEl().addEventListener('pointerdown', e => { if (!e.target.closest('.dicon')) icons.querySelectorAll('.dicon').forEach(x => x.classList.remove('sel')); });
  document.getElementById('startBtn').onclick = e => { e.stopPropagation(); startMenu(); };
  document.getElementById('start').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return; startMenu(false);
    if (b.dataset.app) osLaunch(b.dataset.app);
    else if (b.dataset.act === 'mode') setMode(currentMode() === 'night' ? 'light' : 'night', true);
    else if (b.dataset.act === 'tour') tourStart();
    else if (b.dataset.act === 'tourswap') tourStart('swap');
    else if (b.dataset.act === 'about') toast('Resonance Rift OS: a tiny pastel desktop for swapping songs and writing letters.');
  });
  document.addEventListener('pointerdown', e => { if (!e.target.closest('#start,#startBtn')) startMenu(false); }, true);
  document.getElementById('trayMail').onclick = () => { location.hash = '#inbox'; osOpen('rr'); };
  const clock = document.getElementById('clock'), tick = () => { clock.textContent = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); };
  tick(); setInterval(tick, 15000);
  window.addEventListener('hashchange', () => osOpen('rr'));
  if (location.hash.length > 1) osOpen('rr');
  else if (!tourSeen()) setTimeout(() => { if (!tourSeen() && !TOUR.el) tourStart(); }, 1200);
}
osInit();

/* =====================================================================
   6. BOOT
   ===================================================================== */
(async function boot() {
  const { store, note } = await createStore();
  S.store = store; S.mode = store.mode; S.note = note;
  if (store.mode === 'local') { store.seed(); store.seedTags(); }
  setMode(currentMode(), false);
  document.addEventListener('click', e => { if (e.target.closest('.mode-toggle')) setMode(currentMode() === 'night' ? 'light' : 'night', true); });
  renderFooter();
  const name = session.get();
  if (name) {
    try { const u = await store.getUser(name); if (u) { S.user = normalizeUser(u); S.media = await loadMedia(name); await resumeSwap(); } } catch (e) { console.warn(e); }
  }
  render();
})();
