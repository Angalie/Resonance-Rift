<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<title>Resonance Rift</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<script>(function(){var m="light";try{var v=localStorage.getItem("rr_mode");if(v==="night"||v==="light")m=v;else if(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)m="night";}catch(e){}document.documentElement.setAttribute("data-mode",m);})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,800;1,9..144,400;1,9..144,600&family=Cinzel+Decorative:wght@700;900&family=Pixelify+Sans:wght@400..700&family=Silkscreen:wght@400;700&display=swap">
<style>
/* Layout: one centered column (max 1060px) under a sticky glass header; two-column panels collapse to one under 820px.
   Single theme: light pastel Y2K pixel world (see the theme block at the end of this stylesheet). */
:root{
  --ink:#130c15;        /* room */
  --ink-2:#1d1221;      /* panels */
  --ink-3:#281a2d;      /* raised */
  --line:rgba(253,198,209,.11);
  --line-2:rgba(253,198,209,.22);
  --fg:#f4dfe3;         /* warm paper white */
  --muted:#ca8392;
  --faint:#85746d;
  --amber:#f58ea3;      /* the lamp */
  --ember:#dc4c69;
  --wine:#491a5c;       /* curtain velvet */
  --ok:#d38f9d; --bad:#fa7f98;
  --f-display:'Fraunces', Georgia, 'Times New Roman', serif;
  --f-body:'DM Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-pixel:'Silkscreen', 'Courier New', monospace;
  --r:20px; --r-sm:12px;
  --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--ink)}
body{margin:0;background:var(--ink);color:var(--fg);font:16px/1.6 var(--f-body);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:rgba(19,12,21,.92)}
.room{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(60vmax 45vmax at 12% -8%, rgba(245,142,163,.17), transparent 60%),
    radial-gradient(50vmax 40vmax at 100% 105%, rgba(73,26,92,.55), transparent 65%),
    radial-gradient(40vmax 30vmax at 85% 10%, rgba(220,76,105,.07), transparent 70%),
    var(--ink)}
.room::after{content:"";position:absolute;inset:0;opacity:.05;background-image:radial-gradient(rgba(255,255,255,.7) .5px, transparent .6px);background-size:3px 3px}
a{color:var(--accent-ink)}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.12;text-wrap:balance;margin:0}
h1{font-size:clamp(2.1rem,6vw,3.6rem);letter-spacing:-.02em}
h2{font-size:clamp(1.5rem,3.6vw,2.1rem);letter-spacing:-.01em}
h3{font-size:1.2rem}
p{margin:0}
em{font-style:italic}
.eyebrow{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent-ink);font-weight:700}
.muted{color:var(--muted)}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px;border-radius:6px}

/* ---------- shell ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(19,12,21,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-in,.wrap,.foot-in{max-width:1060px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap;padding-block:12px}
.brand{font-family:var(--f-display);font-size:1.35rem;color:var(--fg);text-decoration:none;display:flex;align-items:center;gap:10px;font-weight:600}
.brand em{color:var(--accent-ink)}
.brand-logo{width:36px;height:36px;border-radius:50%;flex:none;display:block;box-shadow:0 0 0 1px rgba(253,198,209,.18),0 0 16px rgba(206,146,229,.45)}
.auth-logo{width:120px;height:120px;border-radius:50%;display:block;box-shadow:0 0 0 1px rgba(253,198,209,.18),0 0 44px rgba(206,146,229,.5);animation:breathe 7s ease-in-out infinite}
.brand-dot{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fcadbd,var(--amber) 40%,var(--ember) 75%);box-shadow:0 0 14px rgba(245,142,163,.55)}
nav{display:flex;gap:4px;margin-left:auto}
nav a{color:var(--muted);text-decoration:none;font-weight:500;font-size:.95rem;padding:7px 12px;border-radius:999px;transition:color .2s,background .2s}
nav a:hover{color:var(--fg)}
nav a[aria-current="page"]{color:var(--ink);background:var(--amber)}
.who{display:flex;align-items:center;gap:8px;font-size:.88rem;color:var(--muted)}
.hicon{position:relative;display:grid;place-items:center;width:36px;height:36px;flex:none;border-radius:50%;text-decoration:none;font-size:1rem;border:1px solid var(--line);background:rgba(255,255,255,.03)}
.hicon:hover{border-color:var(--accent-ink)}
.hicon[aria-current="page"]{border-color:var(--accent-ink);background:rgba(245,142,163,.14)}
.hicon b,.conv .dot{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--ember);color:#ffffff;font:700 .68rem/18px var(--f-body);text-align:center;font-variant-numeric:tabular-nums}
.conv .dot{top:10px;right:10px}
.who-me{display:flex;align-items:center;gap:8px;color:var(--muted);text-decoration:none;margin-left:4px}
.who-me:hover{color:var(--fg)}
@media (max-width:900px){.who-name{display:none}}
.note-list{display:flex;flex-direction:column;gap:8px;margin-top:24px;max-width:720px}
.note{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:var(--ink-2);color:var(--fg);text-decoration:none;transition:border-color .2s}
.note:hover{border-color:var(--line-2)}
.note.unread{border-color:rgba(245,142,163,.45);background:linear-gradient(90deg,rgba(245,142,163,.10),var(--ink-2) 60%)}
.note-ic{font-size:1.5rem;flex:none}
.note-body{flex:1;min-width:0;display:flex;flex-direction:column}
.note-body b{font-weight:500;overflow-wrap:anywhere}
.note-body small{color:var(--faint);font-size:.8rem}
.note-go{color:var(--faint);font-size:1.4rem}
.inbox{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:18px;margin-top:24px;align-items:start}
.inbox-list{display:flex;flex-direction:column;gap:6px;min-width:0}
.conv{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:12px 40px 12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--ink-2);color:var(--fg);cursor:pointer;font:inherit;min-width:0;width:100%}
.conv:hover{border-color:var(--line-2)}
.conv.on{border-color:var(--accent-ink);background:rgba(245,142,163,.08)}
.conv-name{font-family:var(--f-display);font-style:italic;font-size:1.1rem;color:var(--accent-ink)}
.conv-last{font-size:.85rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.thread{border:1px solid var(--line);border-radius:var(--r);background:linear-gradient(180deg,rgba(40,26,45,.85),rgba(29,18,33,.85));display:flex;flex-direction:column;min-height:420px;min-width:0}
.thread-empty{padding:40px 16px;text-align:center;margin:auto}
.thread-head{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.thread-head div{flex:1;min-width:0;display:flex;flex-direction:column}
.thread-head b{font-family:var(--f-display);font-style:italic;font-size:1.25rem;color:var(--accent-ink);overflow-wrap:anywhere}
.thread-head small{color:var(--faint);font-size:.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thread .back{display:none}
.msgs{flex:1;display:flex;flex-direction:column;gap:8px;padding:16px;overflow-y:auto;max-height:52vh;min-height:220px}
.msg{max-width:80%;padding:9px 13px;border-radius:16px;overflow-wrap:anywhere}
.msg p{white-space:pre-wrap}
.msg.me{align-self:flex-end;background:linear-gradient(180deg,#f66e8a,var(--amber));color:var(--on-acc);border-bottom-right-radius:4px}
.msg.them{align-self:flex-start;background:var(--ink-3);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg small{display:block;font-size:.7rem;opacity:.7;margin-top:2px}
.composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);align-items:flex-end}
.composer textarea{min-height:46px;flex:1;resize:none;min-width:0}
.thread .err{padding:0 16px 10px;margin:0;min-height:0}
@media (max-width:760px){.inbox{grid-template-columns:minmax(0,1fr)}.inbox.open .inbox-list{display:none}.inbox:not(.open) .thread{display:none}.thread .back{display:inline-flex}}
@media (max-width:1000px){
  nav{order:3;width:100%;margin-left:0;justify-content:space-between}
  nav a{flex:1 1 auto;text-align:center;padding:7px 4px;white-space:nowrap}
  .who{margin-left:auto}
}
main.wrap{padding-block:40px 64px;min-height:70vh}
.foot{border-top:1px solid var(--line);color:var(--faint);font-size:.82rem}
.foot-in{padding-block:22px;display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}
.mode-pill{display:inline-flex;align-items:center;gap:8px;color:var(--muted)}
.mode-pill i{width:8px;height:8px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--amber)}
.mode-pill.shared i{background:var(--ok);box-shadow:0 0 8px var(--ok)}

/* ---------- controls ---------- */
.btn{font:600 1rem/1 var(--f-body);display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border-radius:999px;border:1px solid var(--line-2);background:transparent;color:var(--fg);cursor:pointer;text-decoration:none;transition:transform .15s var(--ease),background .2s,border-color .2s,box-shadow .2s}
.btn:hover{border-color:var(--accent-ink)}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(180deg,#f66e8a,var(--amber));color:var(--on-acc);border-color:transparent;box-shadow:0 6px 24px rgba(245,142,163,.25)}
.btn.primary:hover{box-shadow:0 8px 30px rgba(245,142,163,.4)}
.btn.big{font-size:1.1rem;padding:17px 32px}
.btn.small{font-size:.85rem;padding:9px 14px}
.btn.wide{width:100%}
.btn.danger{color:var(--bad);border-color:rgba(250,127,152,.35)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.on{background:rgba(245,142,163,.14);border-color:var(--accent-ink)}
label,.lbl{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:.9rem;margin:18px 0 7px}
input[type=text],input[type=password],input[type=url],textarea,select{width:100%;font:inherit;color:var(--fg);background:var(--ink);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:12px 14px;transition:border-color .2s,box-shadow .2s}
textarea{resize:vertical;min-height:84px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent-ink);box-shadow:0 0 0 3px rgba(245,142,163,.18)}
input[type=color]{width:46px;height:40px;border:1px solid var(--line-2);border-radius:10px;background:var(--ink);padding:3px;cursor:pointer}
input[type=range]{width:100%;accent-color:var(--accent-ink)}
.hint{font-size:.82rem;color:var(--faint);margin-top:6px}
.hint.good{color:var(--ok)}
.err{color:var(--bad);font-size:.9rem;min-height:1.3em;margin-top:12px}
.ctr{font-weight:400;color:var(--faint);font-variant-numeric:tabular-nums}
.panel{background:linear-gradient(180deg,rgba(40,26,45,.85),rgba(29,18,33,.85));border:1px solid var(--line);border-radius:var(--r);padding:clamp(18px,4vw,30px)}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{font-weight:600;font-size:.9rem;margin:18px 0 9px;padding:0}
.pw{position:relative}
.pw input{padding-right:76px}
.pw-t{position:absolute;right:6px;top:50%;transform:translateY(-50%);font:600 .8rem var(--f-body);color:var(--accent-ink);background:transparent;border:1px solid var(--line-2);border-radius:999px;padding:6px 11px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-flex;gap:6px;align-items:center;padding:9px 14px;border-radius:999px;border:1px solid var(--line-2);font-size:.92rem;cursor:pointer;transition:all .2s}
.chip input:checked+span{background:rgba(245,142,163,.15);border-color:var(--accent-ink);color:var(--fg)}
.chip input:focus-visible+span{outline:2px solid var(--amber);outline-offset:2px}
.tag{display:inline-flex;gap:6px;align-items:center;padding:5px 11px;border-radius:999px;font-size:.82rem;background:rgba(245,142,163,.12);color:var(--accent-ink);border:1px solid rgba(245,142,163,.3)}
.tag.dim{background:transparent;color:var(--muted);border-color:var(--line-2)}
.grid2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:28px;align-items:start}
@media (max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* ---------- mystery orb (hidden avatar) ---------- */
.orb{--s:140px;width:var(--s);height:var(--s);max-width:100%;border-radius:50%;position:relative;flex:none;display:grid;place-items:center;
  background:radial-gradient(circle at 34% 28%,rgba(252,173,189,.5),transparent 42%),radial-gradient(circle at 72% 76%,rgba(220,76,105,.5),transparent 50%),radial-gradient(circle,#331d3b,#170e1a 72%);
  box-shadow:0 0 calc(var(--s)*.45) rgba(245,142,163,.22),inset 0 0 calc(var(--s)*.2) rgba(0,0,0,.55),inset 0 0 0 1px rgba(253,198,209,.15);
  animation:breathe 7s ease-in-out infinite}
.orb::before{content:"";position:absolute;left:36%;right:36%;top:22%;height:26%;border-radius:50%;background:rgba(253,216,223,.09)}
.orb::after{content:"";position:absolute;left:22%;right:22%;top:52%;height:30%;border-radius:50% 50% 40% 40%;background:rgba(253,216,223,.07)}
.orb .q{position:relative;z-index:1;font-family:var(--f-display);font-style:italic;font-weight:400;font-size:calc(var(--s)*.36);color:rgba(253,206,216,.9);text-shadow:0 0 calc(var(--s)*.12) rgba(245,142,163,.7);line-height:1}
.orb.logo{background:#110814;overflow:hidden;animation:breatheLogo 7s ease-in-out infinite;
  box-shadow:0 0 calc(var(--s)*.5) rgba(198,129,226,.38),0 0 calc(var(--s)*.18) rgba(245,142,163,.18),inset 0 0 calc(var(--s)*.12) rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.24)}
.orb.logo::before,.orb.logo::after{display:none}
.orb-img{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.orb .gloss{position:absolute;inset:0;border-radius:50%;pointer-events:none;z-index:2;
  background:radial-gradient(ellipse 40% 24% at 34% 17%,rgba(255,255,255,.95),rgba(255,255,255,.35) 45%,rgba(255,255,255,0) 75%),radial-gradient(ellipse 18% 10% at 72% 84%,rgba(253,216,223,.55),transparent 80%),radial-gradient(circle at 70% 88%,rgba(250,145,166,.34),transparent 42%),radial-gradient(circle at 50% 50%,transparent 58%,rgba(17,5,22,.55) 100%);
  box-shadow:inset 0 calc(var(--s)*.012) calc(var(--s)*.03) rgba(255,255,255,.55),inset 0 calc(var(--s)*-.04) calc(var(--s)*.09) rgba(255,255,255,.22),inset 0 0 0 1px rgba(255,255,255,.3)}
@keyframes breatheLogo{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
@keyframes breathe{0%,100%{transform:scale(1);filter:hue-rotate(0)}50%{transform:scale(1.035);filter:hue-rotate(-12deg)}}

/* ---------- home ---------- */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:22px;padding-block:20px 10px}
.hero h1 em{color:var(--accent-ink)}
.lede{font-size:1.12rem;color:var(--muted);max-width:44ch}
.pool{font-size:.88rem;color:var(--faint);display:flex;gap:8px;align-items:center}
.pool i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.home-strip{margin-top:56px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.home-strip .panel{padding:20px}
.home-strip b{font-family:var(--f-display);font-size:1.15rem;display:block;margin-bottom:4px;font-weight:600}
@media (max-width:700px){.home-strip{grid-template-columns:minmax(0,1fr)}}

/* ---------- auth ---------- */
.auth{max-width:440px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.auth .panel{width:100%;text-align:left}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--ink);border:1px solid var(--line-2);border-radius:999px;padding:4px}
.seg button{font:600 .92rem var(--f-body);background:transparent;color:var(--muted);border:0;border-radius:999px;padding:10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--amber);color:var(--on-acc)}
.draft{font-size:.78rem;color:var(--faint);margin-top:16px;padding:10px 12px;border:1px dashed var(--line-2);border-radius:10px}
.draft b{color:var(--muted)}

/* ---------- swap flow ---------- */
.steps{display:flex;gap:6px;list-style:none;margin:0 0 26px;padding:0;flex-wrap:wrap}
.steps li{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:6px 12px;border-radius:999px;border:1px solid var(--line)}
.steps li.done{color:var(--muted)}
.steps li.now{color:var(--ink);background:var(--amber);border-color:var(--accent-ink);font-weight:700}
.quota{font-variant-numeric:tabular-nums}
.quota b{color:var(--accent-ink)}
.namebox{font-family:var(--f-display);font-style:italic;font-size:clamp(1.8rem,5vw,2.6rem);color:var(--accent-ink);min-height:1.3em;overflow-wrap:anywhere}
.name-row{display:flex;gap:8px}
.name-row input{flex:1;min-width:0}
.dice{font-size:1.4rem;width:52px;flex:none;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--ink-3);cursor:pointer;transition:transform .3s var(--ease)}
.dice:hover{border-color:var(--accent-ink)}
.dice.roll{transform:rotate(360deg)}
.placeholder-card{border:1px dashed var(--line-2);border-radius:var(--r);padding:34px 20px;text-align:center;color:var(--faint);font-size:.92rem}

.waiting{display:flex;flex-direction:column;align-items:center;text-align:center;gap:22px;padding-block:20px}
.ripple{position:relative;display:grid;place-items:center;padding:34px}
.ripple span{position:absolute;inset:34px;border-radius:50%;border:1px solid rgba(245,142,163,.45);animation:ripple 3.6s ease-out infinite}
.ripple span:nth-child(2){animation-delay:1.2s}
.ripple span:nth-child(3){animation-delay:2.4s}
@keyframes ripple{from{transform:scale(1);opacity:.8}to{transform:scale(1.9);opacity:0}}
.dots::after{content:"";display:inline-block;width:1.2em;text-align:left;animation:dots 1.6s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}

.stranger{display:flex;align-items:center;gap:16px}
.stranger p{color:var(--muted)}
.emojis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.emo input{position:absolute;opacity:0;pointer-events:none}
.emo span{display:grid;place-items:center;aspect-ratio:1;max-width:100%;font-size:clamp(1.4rem,5vw,1.9rem);border-radius:16px;border:1px solid var(--line-2);background:var(--ink);cursor:pointer;transition:transform .2s var(--ease),border-color .2s,background .2s}
.emo span:hover{transform:translateY(-2px)}
.emo input:checked+span{border-color:var(--accent-ink);background:rgba(245,142,163,.14);transform:scale(1.06)}
.emo input:focus-visible+span{outline:2px solid var(--amber);outline-offset:2px}
.land-out{font-family:var(--f-display);font-style:italic;color:var(--accent-ink);font-weight:600}
.ticks{display:flex;justify-content:space-between;font-size:.72rem;color:var(--faint);margin-top:4px}

/* ---------- the reveal ---------- */
.rv{position:relative;border-radius:26px;overflow:hidden;border:1px solid var(--line);background:radial-gradient(120% 80% at 50% 0%,rgba(245,142,163,.12),transparent 60%),linear-gradient(180deg,#211526,#160e1a);min-height:560px}
.rv-content{position:relative;z-index:1;padding:clamp(22px,5vw,44px);display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);gap:32px;align-items:start}
@media (max-width:820px){.rv-content{grid-template-columns:minmax(0,1fr)}}
.rv-item{opacity:0}
.rv.show .rv-item{animation:riseIn .9s var(--ease) both;animation-delay:calc(var(--i,0)*170ms)}
.rv.done .rv-item{opacity:1}
@keyframes riseIn{from{opacity:0;transform:translateY(14px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.sender{font-family:var(--f-display);font-style:italic;font-size:clamp(2.2rem,7vw,3.6rem);color:var(--accent-ink);line-height:1.05;overflow-wrap:anywhere;text-shadow:0 0 30px rgba(245,142,163,.25)}
/* Reveal: cyberpunk blast doors with a neon hex lock (replaced the velvet curtains + wax seal).
   Sequence: lock pulses → doors jolt + lock glitches out → doors slam open → scan beam sweeps → content rises. */
.curtain{--neon:#a230cf;position:absolute;top:0;bottom:0;width:50.5%;z-index:3;overflow:hidden;
  background:
    repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px),
    radial-gradient(circle at 10px 10px,#4f335a 1.6px,transparent 2.4px) 0 0/44px 44px,
    linear-gradient(90deg,transparent calc(100% - 1px),rgba(250,125,151,.10) calc(100% - 1px)) 0 0/44px 100%,
    linear-gradient(180deg,#27192c 0%,#130c16 50%,#221626 100%);
  box-shadow:inset 0 0 70px rgba(0,0,0,.75);transition:transform 1.5s cubic-bezier(.83,0,.17,1)}
.curtain::before,.curtain::after{content:"";position:absolute;left:0;right:0;height:22px;background:repeating-linear-gradient(-45deg,#e45a76 0 11px,#111111 11px 22px);opacity:.8;box-shadow:0 0 0 2px #09050a}
.curtain::before{top:12%}
.curtain::after{bottom:12%}
.curtain.l{left:0;border-right:2px solid var(--neon);box-shadow:inset 0 0 70px rgba(0,0,0,.75),inset -10px 0 24px rgba(162,48,207,.28)}
.curtain.r{--neon:#b253d7;right:0;border-left:2px solid var(--neon);box-shadow:inset 0 0 70px rgba(0,0,0,.75),inset 10px 0 24px rgba(178,83,215,.28)}
.door-tag{position:absolute;bottom:calc(12% + 38px);font-family:var(--f-pixel);font-size:10px;letter-spacing:.14em;color:var(--neon);text-shadow:0 0 8px var(--neon);white-space:nowrap}
.curtain.l .door-tag{right:16px}
.curtain.r .door-tag{left:16px}
.rv.cracking .curtain{animation:jolt .45s steps(2)}
.rv.cracking .door-tag{animation:flick .45s steps(2) 1}
@keyframes jolt{0%{transform:none}25%{transform:translateX(-3px)}50%{transform:translateX(3px)}75%{transform:translateX(-1px)}}
@keyframes flick{0%{opacity:1}30%{opacity:.2}60%{opacity:1}80%{opacity:.3}}
.rv.open .curtain.l{transform:translateX(-103%)}
.rv.open .curtain.r{transform:translateX(103%)}
.rv.done .curtain{display:none}
.rv::after{content:"";position:absolute;left:0;right:0;top:0;height:2px;z-index:2;opacity:0;pointer-events:none;background:linear-gradient(90deg,transparent,#a230cf 30%,#b253d7 70%,transparent);box-shadow:0 0 16px #a230cf,0 0 30px rgba(178,83,215,.6)}
.rv.open::after{animation:scan 1.7s .5s ease-in-out both}
.rv.done::after{display:none}
@keyframes scan{0%{top:0;opacity:0}10%,85%{opacity:1}100%{top:100%;opacity:0}}
.seal{position:absolute;z-index:4;left:50%;top:min(42%,250px);transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:16px;transition:opacity .5s;filter:drop-shadow(0 0 14px rgba(162,48,207,.55))}
.wax{position:relative;width:112px;height:112px;display:grid;place-items:center;clip-path:polygon(25% 4%,75% 4%,100% 50%,75% 96%,25% 96%,0 50%);
  background:linear-gradient(135deg,#a230cf,#c37be0 50%,#b253d7);animation:sealPulse 1.6s ease-in-out infinite}
.wax::before{content:"";position:absolute;inset:4px;clip-path:inherit;background:radial-gradient(circle,#2a1233 0%,#0e0910 80%)}
.wax span{position:relative;font-family:var(--f-pixel);font-size:52px;line-height:1;color:#ffffff;text-shadow:2px 0 0 #b253d7,-2px 0 0 #a230cf,0 0 14px #a230cf}
.seal p{font-family:var(--f-pixel);font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:#fa849c;background:rgba(11,5,14,.88);border:1px solid rgba(162,48,207,.5);padding:6px 12px;border-radius:2px;text-shadow:0 0 6px rgba(162,48,207,.7)}
@keyframes sealPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.rv.cracking .wax{animation:crack .7s steps(6) forwards}
.rv.cracking .seal p{opacity:0;transition:opacity .25s}
@keyframes crack{0%{transform:none}20%{transform:translate(-5px,2px) skewX(10deg);filter:hue-rotate(90deg)}40%{transform:translate(5px,-2px) skewX(-12deg)}60%{transform:scale(1.18);opacity:.8}100%{transform:scale(.3);opacity:0;filter:blur(6px)}}
.rv.done .seal,.rv.open .seal{opacity:0;pointer-events:none}

.pp.wa .wa-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pp.wa .wa-btns{display:flex;gap:6px}

.pp.wa .wa-b.off{opacity:.5;cursor:not-allowed}
.pp.wa .wa-vol{display:flex;align-items:center;gap:6px;min-width:0;flex:1;justify-content:flex-end}
.pp.wa .wa-spk{font-size:12px;filter:grayscale(1) brightness(.6)}
.pp.wa .wa-vt{flex:1;max-width:96px;height:8px;border:2px solid #8e6a70;border-radius:5px;background:linear-gradient(180deg,#bd949a,#e8cdd0);position:relative}
.pp.wa .wa-vt b{position:absolute;right:18%;top:-6px;width:20px;height:14px;border:2px solid #7a5b60;border-radius:7px;background:linear-gradient(180deg,#fdf1f1,#cba3a9)}
.pp.wa .pp-foot{margin:0;padding:6px 8px 8px;background:linear-gradient(180deg,#e3c3c6,#cfa6ac);border-top:2px solid #b78d93}
.pp.wa .pp-tag{background:#4a3a3d;color:#f3d8dc;border-radius:3px}

.pp.wa .pp-embed summary{color:#4a3a3d}
.pp.wa.compact{max-width:none;box-shadow:3px 3px 0 rgba(60,35,45,.35)}
.pp.wa.compact .wa-menu,.pp.wa.compact .wa-vol{display:none}
.pp.wa.compact .wa-time{font-size:15px}
.pp.wa.compact .wa-b{width:26px;height:26px;font-size:8px}
.pp.wa.compact .wa-spec{height:26px;width:46px}
@media (prefers-reduced-motion:reduce){.pp.wa .wa-run{animation:none!important;transform:none!important}.pp.wa.playing .wa-spec i,.pp.playing.wa .wa-seek b{animation:none!important}}
.pp.compact{padding:10px;max-width:none;box-shadow:4px 4px 0 rgba(0,0,0,.45),inset 0 0 0 2px #fee6eb}
.pp.compact .cd{width:48px;height:48px}
.pp.compact .cd span{font-size:10px}
.pp.compact .pbtn{width:30px;height:28px;font-size:9px;box-shadow:2px 2px 0 var(--pkd)}
.pp.compact .pbtn.play{width:34px;font-size:11px}
.pp.compact .pp-title{font-size:10px;min-height:0;-webkit-line-clamp:2}
.pp.compact .pp-now{font-size:8px;margin:5px 0 3px}

/* ---------- swaps history ---------- */
.hist{display:grid;gap:18px}
.hist-item{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:760px){.hist-item{grid-template-columns:minmax(0,1fr)}}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 16px;font-size:.94rem;margin-top:14px}
.kv dt{color:var(--faint)}
.kv dd{margin:0;overflow-wrap:anywhere}
.empty{text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px;padding:40px 20px}

/* ---------- how ---------- */
.how{list-style:none;margin:28px 0 0;padding:0;display:grid;gap:14px;counter-reset:s}

/* ---------- profile editor + MySpace-style card ---------- */
.pgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}

.sticky-prev{position:sticky;top:90px}
@media (max-width:900px){.sticky-prev{position:static}}
.ed-sec{border-top:1px solid var(--line);margin-top:22px;padding-top:6px}

.emo-field{position:relative;display:flex;align-items:center;gap:10px;flex-wrap:wrap}

.emoji-pick{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.emoji-pick button{font-size:1.25rem;aspect-ratio:1;border-radius:10px;border:1px solid var(--line-2);background:var(--ink);cursor:pointer}

.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 14px}

.top8-in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
@media (max-width:520px){.top8-in{grid-template-columns:minmax(0,1fr)}}
.colorrow{display:flex;gap:10px;align-items:center}
.check{display:flex;gap:10px;align-items:center;font-weight:500;margin:16px 0 0;justify-content:flex-start;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--accent-ink)}

.pf{--pa:#f58ea3;position:relative;overflow:hidden;border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px;color:#ffffff;border:1px solid var(--line)}
.pf-box{padding:14px 16px;position:relative;z-index:1;min-width:0}
.pf h4{margin:0 0 6px;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--pa);font-family:inherit}

.pf-gshow{display:flex;align-items:center;gap:8px;margin:6px 0 10px;font-weight:600}

/* avatar + frames (placeholder frames: pure CSS until real art exists) */

.fr-neon .av-img{box-shadow:0 0 0 2px var(--pa),0 0 12px var(--pa),0 0 26px var(--pa)}
.fr-rainbow{padding:5px}
.fr-rainbow::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(#f9718d,#f9718d,#fa7f98,#f58ca1,#fa7f98,#d5a1e9,#ce93e6,#f9718d);animation:spin 4s linear infinite}
.fr-pixel,.fr-polaroid{border-radius:0}

.fd{position:absolute;z-index:2;font-style:normal;font-size:calc(var(--sz) * .27);line-height:1;filter:drop-shadow(0 1px 2px rgba(0,0,0,.45))}
.fd0{top:-7%;left:-7%}.fd1{top:-7%;right:-7%}.fd2{bottom:-7%;left:-7%}.fd3{bottom:-7%;right:-7%}

.nt-chrome{font-family:var(--f-display);font-style:italic;font-weight:800;background:linear-gradient(180deg,#ffffff 0%,#dccce3 40%,#87579a 52%,#f1e8f5 70%,#b28fc0 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 rgba(0,0,0,.45))}
.nt-hello{display:inline-flex;flex-direction:column;align-items:center;background:#d8264a;border-radius:10px;padding:5px 5px 6px;color:#ffffff;font-family:var(--f-body);box-shadow:0 4px 10px rgba(0,0,0,.35);min-width:min(150px,100%)}

.nt-hello small{font-size:.6rem;letter-spacing:.06em;margin-bottom:4px;font-weight:500}
.nt-hello span{background:#ffffff;color:#1a1a1a;font-family:'Caveat',cursive;font-size:1.6rem;padding:0 12px;border-radius:4px;width:100%;text-align:center}
.nt-cassette{display:inline-flex;align-items:center;gap:8px;background:#f4d8de;color:#291b2f;border-radius:6px;padding:4px 12px;border-top:6px solid var(--pa);font-family:'Caveat',cursive;font-size:1.6rem;box-shadow:0 3px 8px rgba(0,0,0,.3)}
.nt-cassette i{width:14px;height:14px;border-radius:50%;border:3px dotted #291b2f;flex:none}
.nt-ransom{display:flex;flex-wrap:wrap;gap:2px}
.nt-ransom span{display:inline-block;padding:2px 5px;transform:rotate(var(--r));font-size:1.2rem}
.rn0{background:#ffffff;color:#111111;font-family:var(--f-display)}
.rn1{background:#111111;color:#ffffff;font-family:var(--f-pixel)}
.rn2{background:var(--pa);color:#111111;font-family:var(--f-body)}
.rn3{background:#f85476;color:#b91e3e;font-family:'Caveat',cursive;font-size:1.4rem!important}
.rn4{background:#f1e0f8;color:#481a5a;font-family:'Courier New',monospace}

/* editor widgets */
.av-edit{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-top:14px}
.filebtn:focus-within{outline:2px solid var(--amber);outline-offset:3px}
.cropper{margin-top:14px;padding:16px;border:1px solid var(--line-2);border-radius:16px;background:var(--ink)}
.crop-box{position:relative;width:240px;max-width:100%;aspect-ratio:1;margin:0 auto;touch-action:none;cursor:grab;border-radius:12px;overflow:hidden;background:#000000}
.crop-box:active{cursor:grabbing}
.crop-img{position:absolute;inset:0;background-repeat:no-repeat}
.crop-mask{position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 999px rgba(0,0,0,.6);outline:2px dashed rgba(255,255,255,.75);outline-offset:-2px;pointer-events:none}
.swatches{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.swatches button{width:38px;height:38px;border-radius:50%;border:2px solid var(--line-2);cursor:pointer}

.colorpair{display:flex;flex-wrap:wrap;gap:18px;margin-top:12px}

.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;margin-top:12px}

.pick-grid button[aria-pressed="true"]{border-color:var(--accent-ink);background:rgba(245,142,163,.12);box-shadow:inset 0 0 0 1px var(--amber)}
.pick-grid .pv{display:grid;place-items:center;min-height:62px;max-width:100%;color:#ffffff}
.pick-grid .nt{font-size:.95rem}

.pick-grid .nt-ransom{max-width:100px;justify-content:center}
.pick-grid .nt-ransom span{font-size:.68rem;padding:1px 3px}
.pick-grid .nt-pixel{font-size:.58rem;white-space:nowrap;padding:5px 6px}
.bg-thumb{width:72px;height:46px;border-radius:10px;border:1px solid var(--line-2);flex:none}
.qs{cursor:pointer;font:inherit;font-size:.82rem}
.qs:hover{border-color:var(--accent-ink);color:var(--fg)}
.pf-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:560px){.pf-stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.lcd{background:#09060a;border:2px solid #32203a;border-radius:8px;padding:8px 6px;text-align:center}
.lcd b{display:block;font-family:var(--f-pixel);font-size:clamp(.72rem,3.4vw,1.05rem);color:var(--pa);letter-spacing:.02em;white-space:nowrap;font-variant-numeric:tabular-nums;text-shadow:0 0 6px var(--pa)}
.lcd span{font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:#a99fb0}
.pf-top8{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.shelf{display:flex;flex-wrap:wrap;gap:6px}
.shelf span{font-size:1.4rem;width:40px;height:40px;display:grid;place-items:center;border-radius:10px;background:rgba(0,0,0,.25)}
.pf-marquee{overflow:hidden;white-space:nowrap;position:relative;z-index:1;padding:6px 0;font-weight:700;color:var(--pa);border-block:1px dashed currentColor}
.pf-marquee span{display:inline-block;padding-left:100%;animation:marq 14s linear infinite}
@keyframes marq{to{transform:translateX(-100%)}}
.sparkles{position:absolute;inset:0;pointer-events:none;z-index:2}
.sparkles i{position:absolute;font-style:normal;color:#ffffff;text-shadow:0 0 6px var(--pa),0 0 12px #ffffff;animation:twinkle 2.4s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1.1)}}
.pc-glass .pf-box{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.2);border-radius:16px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.pc-pixel .pf-box{background:#281530;border:3px solid var(--pa);box-shadow:4px 4px 0 #000000;border-radius:0}
.pc-pixel h4,.pc-pixel .pf-name{font-family:var(--f-pixel)}
.pc-pixel .pf-av{border-radius:0}
.pc-neon .pf-box{background:rgba(12,6,14,.82);border:1.5px solid var(--pa);border-radius:12px;box-shadow:0 0 14px var(--pa),inset 0 0 12px rgba(255,255,255,.04)}
.pc-neon h4{text-shadow:0 0 8px var(--pa)}
.pc-paper .pf-box{background:#f7e3e7;color:#291b2f;border-radius:3px;box-shadow:0 2px 0 rgba(0,0,0,.12),0 12px 22px rgba(0,0,0,.28)}

.pc-paper .pf-box:nth-child(even){transform:rotate(.35deg)}
.pc-paper h4{color:#61227a}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.badge{border:1px solid var(--line-2);border-radius:14px;padding:12px;background:var(--ink)}

.badge b{display:block;font-size:.92rem;margin-top:4px}
.badge small{display:block;color:var(--faint);font-size:.76rem;line-height:1.35}
.badge .bar{height:5px;border-radius:3px;background:var(--line-2);margin-top:9px;overflow:hidden}
.badge .bar i{display:block;height:100%;background:var(--amber)}

.badge.locked{opacity:.55;filter:grayscale(1)}
.lab{border:1px dashed rgba(211,143,157,.45);background:rgba(211,143,157,.05)}

/* ---------- toasts ---------- */
.toasts{position:fixed;z-index:50;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;width:min(420px,calc(100% - 32px));pointer-events:none}
.toast{background:#2d1d33;border:1px solid var(--line-2);color:var(--fg);padding:12px 16px;border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.45);font-size:.92rem;animation:riseIn .4s var(--ease) both;transition:opacity .5s,transform .5s;display:flex;gap:12px;align-items:center}
.toast.badge-t{border-color:var(--accent-ink)}
.toast .t-ic{font-size:1.8rem}
.toast b{display:block;color:var(--accent-ink);font-size:.75rem;letter-spacing:.14em;text-transform:uppercase}
.toast.out{opacity:0;transform:translateY(8px)}
.loading{display:grid;place-items:center;min-height:50vh;color:var(--muted)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  .rv.show .rv-item{animation:fadeOnly .4s ease both!important}
  @keyframes fadeOnly{from{opacity:0}to{opacity:1}}
  .pf-marquee span{padding-left:0}
}

/* =====================================================================
   Y2K PASTEL PIXEL THEME  (overrides the base styles above)
   Palette: purple #8c45a8 + pink #f58ea3. Retro-OS windows with pixel outlines,
   a pixel-art sky and landscape behind everything, chat.exe-style messages.
   ===================================================================== */
:root{
  --ink:var(--surf); --ink-2:#fee8ec; --ink-3:var(--surf-lav);
  --edge:#632a7a;                       /* pixel outlines */
  --line:rgba(140,69,168,.22); --line-2:rgba(140,69,168,.45);
  --fg:#421853; --muted:#632f78; --faint:#7e4a92;
  --amber:#f58ea3;                      /* accent fill (pink) */
  --accent-ink:#8c45a8;                 /* accent as text (purple) */
  --on-acc:#3e134f;                     /* text on pink */
  --ember:#d63354; --ok:#61237a; --bad:#c22545;
  --f-display:'Pixelify Sans','Silkscreen','Courier New',monospace;

body{image-rendering:auto}
.room{display:none}

/* type */
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:0}
h1{font-size:clamp(2.2rem,6.2vw,3.7rem);line-height:1.08;text-shadow:3px 3px 0 rgba(255,255,255,.75)}
h2{font-size:clamp(1.5rem,3.4vw,2.1rem)}
em{font-style:normal;color:var(--accent-ink)}
.sender,.namebox,.conv-name,.thread-head b,.quote,.note-q,.land-out,.how li::before,.orb .q,.nt-neon,.nt-chrome,h3[style*="italic"],.hist-item h3{font-style:normal}
.eyebrow{color:var(--edge);letter-spacing:.14em}
a{color:var(--accent-ink)}
:focus-visible{outline:3px solid var(--accent-ink);outline-offset:2px;border-radius:4px}
.hero .lede{color:var(--lede)}
.hero .pool{color:var(--muted)}
.live{display:inline-flex;align-items:center;gap:7px;font:700 .85rem/1.2 var(--f-body)}
.live-n{font-variant-numeric:tabular-nums;font-size:1.05em}
.live-dot{width:9px;height:9px;border-radius:50%;background:#3ddc84;box-shadow:0 0 0 0 rgba(61,220,132,.7);animation:livePulse 1.8s ease-out infinite}
@keyframes livePulse{0%{box-shadow:0 0 0 0 rgba(61,220,132,.65)}70%{box-shadow:0 0 0 8px rgba(61,220,132,0)}100%{box-shadow:0 0 0 0 rgba(61,220,132,0)}}
@media (prefers-reduced-motion:reduce){.live-dot{animation:none}}
#deskFrame{position:fixed;inset:0;z-index:8000;pointer-events:none;box-sizing:border-box;border:3px solid var(--fr-a,#F58EA3);border-radius:10px;box-shadow:inset 0 0 0 1px var(--fr-b,#ffd9e6),inset 0 0 14px rgba(20,8,30,.22);transition:border-color .45s,box-shadow .45s}
#deskFrame i{position:absolute;width:7px;height:7px;background:var(--fr-b,#ffd9e6);border:2px solid var(--fr-a,#F58EA3);transform:rotate(45deg);transition:background .45s,border-color .45s}
#deskFrame i:nth-child(1){left:-5px;top:-5px}#deskFrame i:nth-child(2){right:-5px;top:-5px}#deskFrame i:nth-child(3){left:-5px;bottom:-5px}#deskFrame i:nth-child(4){right:-5px;bottom:-5px}
.uni-stage{position:relative}
.uni-live{position:absolute;top:10px;left:10px;z-index:2;padding:5px 12px;border-radius:999px;background:rgba(8,4,20,.72);border:2px solid rgba(255,255,255,.28);color:#fff;pointer-events:none}
.pool-live .live{color:var(--fg)}
.pool-n{font-variant-numeric:tabular-nums;font-size:1.15em;color:var(--fg)}
.hero .eyebrow{background:var(--surf);border:2px solid var(--edge);padding:3px 10px;border-radius:6px;box-shadow:0 3px 0 var(--edge)}

/* HUD-style header */
.top{background:transparent;border:0;backdrop-filter:none;-webkit-backdrop-filter:none;padding:10px max(12px,env(safe-area-inset-left,0px)) 0}
.top-in{max-width:1036px;margin:0 auto;padding:8px 14px;background:var(--ink);border:3px solid var(--edge);border-radius:14px;box-shadow:4px 4px 0 var(--shadow),inset 0 0 0 2px var(--hi)}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.4rem;color:var(--edge)}
.brand em{color:var(--accent-ink)}
.brand-logo{box-shadow:0 0 0 2px var(--edge),0 3px 0 2px var(--edge)}
.auth-logo{box-shadow:0 0 0 3px var(--edge),0 7px 0 3px var(--shadow)}
nav a{font-family:var(--f-display);font-weight:600;font-size:1.02rem;color:var(--fg);border-radius:8px;border:2px solid transparent}
nav a:hover{color:var(--fg);background:var(--ink-3);border-color:var(--line-2)}
nav a[aria-current="page"]{background:var(--amber);color:var(--on-acc);border-color:var(--edge);box-shadow:0 3px 0 var(--edge)}
.hicon,.cass{border:2px solid var(--edge);border-radius:8px;background:var(--white);color:var(--fg);box-shadow:0 3px 0 var(--edge)}
.hicon:hover,.cass:hover{background:var(--surf-2);border-color:var(--edge)}
.hicon[aria-current="page"],.cass[aria-current="page"]{background:var(--amber);border-color:var(--edge)}
.who-me,.who{color:var(--muted)}
.nav-n,.hicon b,.conv .dot,.tabs button b{background:var(--ember);color:#ffffff;border:2px solid var(--edge)}
.foot{background:var(--ink-2);border-top:3px solid var(--edge);color:var(--muted);margin-top:36px}
.mode-pill{color:var(--muted)}
.mode-pill i{background:var(--amber);box-shadow:0 0 0 2px var(--edge)}
.mode-pill.shared i{background:#9b3cc0}

/* windows */
.panel{--pad:clamp(18px,4vw,30px);position:relative;background:var(--ink-2);border:3px solid var(--edge);border-radius:14px;padding:var(--pad);padding-top:calc(var(--pad) + 34px);box-shadow:5px 5px 0 var(--shadow),inset 0 0 0 2px var(--hi)}
.home-strip .panel{--pad:18px;padding:18px;padding-top:calc(18px + 34px)}
.songpick{justify-content:flex-start}
/* the pixel font's "fi"/"fl" ligatures render as odd glyphs ("Profile" looked like "ProAle"): turn ligatures off everywhere */
body{font-variant-ligatures:none;font-feature-settings:"liga" 0,"clig" 0}
/* window title text lines up with the text inside the window */
.panel::before{padding-left:var(--pad)}
.thread::before{padding-left:24px}

/* profile card: the default "Pixel window" style uses the site's retro windows (follows day / night) */
:root{--tb-a:#fdcbd5;--tb-b:#f58ea3;--tb-ink:#632a7a}
html[data-mode="night"]{--tb-a:#9c55b8;--tb-b:#6f2e88;--tb-ink:#fee1e7}
.pc-pixel .pf-box{background:var(--ink-2);color:var(--fg);border:3px solid var(--edge);border-radius:10px;box-shadow:4px 4px 0 var(--shadow)}
.pc-pixel .pf-box:has(> h4){padding:0 16px 14px;overflow:hidden}
.pc-pixel .pf-box > h4{margin:0 -16px 12px;padding:3px 12px;background:linear-gradient(180deg,var(--tb-a),var(--tb-b));border-bottom:3px solid var(--edge);color:var(--tb-ink);font:400 .7rem/1.6 var(--f-pixel);letter-spacing:.08em;text-transform:uppercase}
.pc-pixel .pf-head{background:#34193f;color:#ffffff}
.pc-pixel .pf-status{background:rgba(255,255,255,.14);color:#ffffff}
.pc-pixel .lcd{background:var(--ink);border:2px solid var(--edge);border-radius:6px}
.pc-pixel .lcd b{color:var(--accent-ink);text-shadow:none}
.pc-pixel .lcd span{color:var(--muted)}
.pc-pixel .shelf span{background:var(--ink);border:2px solid var(--edge);border-radius:6px}
.pc-pixel .pf-marquee{color:var(--edge);background:var(--plate);border:2px solid var(--edge);border-radius:6px;padding:4px 0}

/* home emblem: "pixel portal" (spinning pixel ring, twinkling stars, floating bob) instead of the glass bubble */
.orb.logo{background:none;box-shadow:none;overflow:visible;margin-bottom:16px;animation:floatBob 3.2s steps(8) infinite}
.orb.logo::before{display:block;content:"";position:absolute;inset:0;left:0;right:0;top:0;height:auto;border-radius:50%;
  background:repeating-conic-gradient(#f58ea3 0 10deg,#8c45a8 10deg 20deg);
  -webkit-mask:radial-gradient(circle,transparent 64%,#000000 65%);mask:radial-gradient(circle,transparent 64%,#000000 65%);
  animation:ringSpin 14s steps(72) infinite}
.orb.logo::after{display:block;content:"";position:absolute;left:18%;right:18%;bottom:-16px;top:auto;height:10px;border-radius:50%;background:var(--shadow);animation:shadowPulse 3.2s steps(8) infinite}
.orb.logo .orb-img{inset:10%;width:80%;height:80%;border:4px solid var(--edge);box-shadow:0 0 0 4px var(--surf),0 0 0 7px var(--edge)}
.orb.logo .gloss{inset:-16px;border-radius:0;background:none;box-shadow:none}
.orb.logo .gloss::before{content:"✦";position:absolute;top:0;right:6px;font-size:26px;line-height:1;color:#fa8fa5;text-shadow:2px 2px 0 var(--edge);animation:twinkle 2.2s steps(4) infinite}
.orb.logo .gloss::after{content:"✧";position:absolute;bottom:12px;left:2px;font-size:20px;line-height:1;color:#ffffff;text-shadow:2px 2px 0 var(--edge);animation:twinkle 2.2s steps(4) .8s infinite}
@keyframes floatBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes ringSpin{to{transform:rotate(360deg)}}
@keyframes shadowPulse{0%,100%{transform:scaleX(1);opacity:.9}50%{transform:scaleX(.82);opacity:.6}}
.panel::before,.thread::before{content:var(--title,"♥ rift.exe");position:absolute;left:0;right:0;top:0;height:30px;padding:0 96px 0 12px;background:linear-gradient(180deg,#fdcbd5,#f58ea3);border-bottom:3px solid var(--edge);border-radius:10px 10px 0 0;font:400 12px/27px var(--f-pixel);color:var(--edge);letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel::after,.thread::after{content:"";position:absolute;right:8px;top:4px;width:72px;height:20px;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20width%3D'72'%20height%3D'20'%20viewBox%3D'0%200%2072%2020'%20shape-rendering%3D'crispEdges'%3E%3Cg%20fill%3D'%23fff4f8'%20stroke%3D'%235b2a7a'%20stroke-width%3D'2'%3E%3Crect%20x%3D'1'%20y%3D'1'%20width%3D'18'%20height%3D'18'%2F%3E%3Crect%20x%3D'25'%20y%3D'1'%20width%3D'18'%20height%3D'18'%2F%3E%3Crect%20x%3D'49'%20y%3D'1'%20width%3D'18'%20height%3D'18'%2F%3E%3C%2Fg%3E%3Cg%20fill%3D'%235b2a7a'%3E%3Crect%20x%3D'5'%20y%3D'13'%20width%3D'10'%20height%3D'2'%2F%3E%3C%2Fg%3E%3Cpath%20d%3D'M29%206h10v8H29z'%20fill%3D'none'%20stroke%3D'%235b2a7a'%20stroke-width%3D'2'%2F%3E%3Cpath%20d%3D'M53%205l10%2010M63%205L53%2015'%20stroke%3D'%235b2a7a'%20stroke-width%3D'2'%20fill%3D'none'%2F%3E%3C%2Fsvg%3E") no-repeat right center/72px 20px;image-rendering:pixelated}
.panel.lab{--title:"♥ test_lab.exe";border-style:solid;background:var(--lab-bg)}
.panel.lab h3{color:var(--ok)}
.react-card{border:3px solid var(--line-2)}

/* buttons */
.btn{font-family:var(--f-display);font-weight:600;font-size:1.02rem;border-radius:10px;border:3px solid var(--edge);background:var(--surf);color:var(--edge);padding:9px 18px;box-shadow:0 4px 0 var(--edge);transition:transform .08s,box-shadow .08s,background .15s}
.btn:hover{background:var(--surf-2);border-color:var(--edge)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.btn.primary{background:linear-gradient(180deg,var(--acc-a,#fcbfcb),var(--acc-b,#f58ea3));color:var(--on-acc);border-color:var(--edge);box-shadow:0 4px 0 var(--edge)}
.btn.primary:hover{background:linear-gradient(180deg,#fdccd6,#f77f97)}
.btn.big{font-size:1.2rem;padding:13px 26px}
.btn.small{font-size:.92rem;padding:5px 12px;box-shadow:0 3px 0 var(--edge)}
.btn.small:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
.btn.danger{color:var(--bad);border-color:var(--bad);box-shadow:0 4px 0 var(--bad);background:var(--surf)}
.btn.on{background:var(--surf-lav2)}
.btn[disabled]{opacity:.55;box-shadow:0 2px 0 var(--edge);cursor:not-allowed}
.pw-t{font-family:var(--f-display);color:var(--edge);background:var(--surf);border:2px solid var(--edge);border-radius:6px}

/* inputs */
input[type=text],input[type=password],input[type=url],textarea,select{font-family:var(--f-body);color:var(--fg);background:var(--white);border:3px solid var(--edge);border-radius:8px;box-shadow:inset 2px 2px 0 var(--inset);padding:10px 12px}
input:focus,textarea:focus,select:focus{border-color:var(--accent-ink);box-shadow:inset 2px 2px 0 var(--inset),0 0 0 3px rgba(245,142,163,.6)}
::placeholder{color:var(--ph);opacity:1}
input[type=color]{border:3px solid var(--edge);border-radius:8px;background:var(--white)}
input[type=range]{accent-color:var(--accent-ink)}
.check input{accent-color:var(--accent-ink)}
.rte{border:3px solid var(--edge);border-radius:8px;background:var(--white)}
.rte:focus-within{border-color:var(--accent-ink);box-shadow:0 0 0 3px rgba(245,142,163,.6)}
.rte-bar{border-bottom:2px solid var(--line-2)}
.rte-bar button:hover{background:var(--ink-3)}
.rte-bar button[aria-pressed="true"],.rte-bar button[aria-expanded="true"]{background:var(--surf-3);border-color:var(--edge)}
.rte-sep{background:var(--line-2)}
.emoji-pop{background:var(--white);border:3px solid var(--edge);box-shadow:4px 4px 0 var(--shadow)}
.emoji-pop button:hover,.emoji-pop button:focus-visible{background:var(--surf-3)}
.cropper{background:var(--white);border:3px solid var(--edge)}

/* chips, tags, tabs, steps */
.chip span{border:3px solid var(--edge);border-radius:8px;background:var(--surf);box-shadow:0 3px 0 var(--edge);padding:6px 12px;font-weight:500}
.chip input:checked+span{background:var(--amber);color:var(--on-acc);font-weight:700}
.chip input:focus-visible+span{outline:3px solid var(--accent-ink)}
.tag{border:2px solid var(--edge);border-radius:6px;background:var(--surf);color:var(--accent-ink);font-weight:600}
.tag.dim{background:var(--surf-lav);color:var(--muted);border-color:var(--line-2)}
.quota b{color:var(--accent-ink)}
.steps li{font-family:var(--f-display);font-size:.9rem;letter-spacing:.02em;text-transform:none;color:var(--muted);background:var(--surf);border:2px solid var(--edge);border-radius:6px;box-shadow:0 3px 0 var(--edge)}
.steps li.done{color:var(--fg);background:var(--surf-2)}
.steps li.now{color:var(--on-acc);background:var(--amber);border-color:var(--edge)}
.steps li a:hover{color:var(--fg);background:var(--surf-3)}
.tabs{border-bottom:3px solid var(--edge)}
.tabs button{font-family:var(--f-display);font-weight:600;font-size:1rem;color:var(--fg);background:var(--surf);border:3px solid var(--edge);border-bottom:0;border-radius:8px 8px 0 0;padding:7px 16px}
.tabs button:hover{background:var(--surf-2)}
.tabs button[aria-selected="true"]{background:var(--amber);color:var(--on-acc)}
.pill{border:2px solid var(--edge);border-radius:6px;background:var(--white)}
.pill.ok{color:var(--ok);border-color:var(--ok)} .pill.bad{color:var(--bad);border-color:var(--bad)} .pill.wait{color:var(--accent-ink);border-color:var(--accent-ink)} .pill.dim{color:var(--faint);border-color:var(--line-2)}
.seg{background:var(--white);border:3px solid var(--edge);border-radius:10px}
.seg button{font-family:var(--f-display);font-size:1rem;color:var(--fg);border-radius:6px}
.seg button[aria-pressed="true"]{background:var(--amber);color:var(--on-acc)}
.draft{border:2px dashed var(--accent-ink);background:var(--surf);color:var(--muted)}
.draft b{color:var(--fg)}
.confirm{border:3px solid var(--bad);background:var(--surf-bad);color:var(--fg)}
.gift-pick{border:3px solid var(--edge);background:var(--surf)}
.placeholder-card{border:3px dashed var(--edge);background:var(--plate);color:var(--muted)}

/* lists and cards */
.note{border:3px solid var(--edge);border-radius:10px;background:var(--surf);color:var(--fg);box-shadow:3px 3px 0 var(--shadow)}
.note:hover{background:var(--surf-2);border-color:var(--edge)}
.note.unread{background:var(--surf-3);border-color:var(--edge)}
.songpick{border:3px solid var(--edge);border-radius:8px;background:var(--white)}
.songpick:has(input:checked){background:var(--surf-3);border-color:var(--edge)}
.songpick input{accent-color:var(--accent-ink)}
.cass-eq div{border:3px solid var(--edge);border-radius:8px;background:var(--white)}
.dice,.emo span{border:3px solid var(--edge);border-radius:8px;background:var(--white);box-shadow:0 3px 0 var(--edge)}
.emo input:checked+span{background:var(--amber);border-color:var(--edge)}
.badge{border:3px solid var(--edge);border-radius:8px;background:var(--white)}
.badge .bar{background:var(--ink-3)} .badge .bar i{background:var(--amber)}
.emoji-pick button{border:2px solid var(--edge);border-radius:6px;background:var(--white)}
.emoji-pick button[aria-pressed="true"]{background:var(--amber)}
.pick-grid button{border:3px solid var(--edge);border-radius:8px;background:var(--white);color:var(--fg);box-shadow:0 3px 0 var(--edge)}
.pick-grid button[aria-pressed="true"]{background:var(--surf-3);box-shadow:0 3px 0 var(--edge),inset 0 0 0 2px var(--amber)}
.pick-grid .pv{background:#34193f;border-radius:6px;padding:8px 4px;width:100%;color:#ffffff}
.swatches button{border:3px solid var(--edge)}
.bg-thumb{border:3px solid var(--edge);border-radius:8px}
.kv dt{color:var(--muted)}
.meter i{border-radius:0;background:var(--surf-lav);border:1px solid var(--edge)} .meter i.f{background:var(--amber)}
.cass-amt.in{color:var(--ok)} .cass-amt.out{color:var(--bad)}
.thanks-in{color:var(--ok)}
.pending .pulse{background:var(--accent-ink)}
.pf{border:3px solid var(--edge);border-radius:14px}
.pf h4,.pf-name{font-family:var(--f-display)}
.pp{box-shadow:6px 6px 0 var(--shadow),inset 0 0 0 3px #fee6eb}
.pp.compact{box-shadow:4px 4px 0 var(--shadow),inset 0 0 0 2px #fee6eb}
.toast{background:var(--surf);color:var(--fg);border:3px solid var(--edge);border-radius:10px;box-shadow:4px 4px 0 var(--shadow)}
.toast.badge-t{border-color:var(--edge);background:var(--surf-2)}
.toast b{color:var(--accent-ink)}
.ripple span{border:3px solid rgba(245,142,163,.8)}

/* the mystery bubble: pastel glass sphere */
.orb{background:radial-gradient(circle at 31% 23%,rgba(255,255,255,.95),rgba(255,255,255,0) 32%),radial-gradient(circle at 72% 82%,rgba(245,142,163,.95),transparent 55%),radial-gradient(circle at 50% 50%,#e0b9ef,#8c45a8 88%);
  box-shadow:0 0 0 3px var(--edge),0 7px 0 3px var(--shadow),inset 0 -8px 16px rgba(99,42,122,.35),inset 0 6px 10px rgba(255,255,255,.6);animation:breatheLogo 7s ease-in-out infinite}
.orb::before{background:rgba(255,255,255,.28)} .orb::after{background:rgba(255,255,255,.14)}
.orb .q{color:#ffffff;font-weight:700;text-shadow:0 3px 0 rgba(99,42,122,.65)}
.orb.logo{background:#110814;box-shadow:0 0 0 3px var(--edge),0 7px 0 3px var(--shadow)}

/* the reveal stays a dark moment: scoped dark tokens keep it readable */
.rv{--ink:#160e1a;--ink-2:#211526;--ink-3:#2d1d33;--fg:#f2e9f6;--muted:#cbb3d5;--faint:#aa83ba;--line:rgba(254,223,230,.14);--line-2:rgba(254,223,230,.3);--accent-ink:#f9a8b9;--on-acc:#3e134f;color:var(--fg);border:3px solid var(--edge);border-radius:14px;box-shadow:5px 5px 0 var(--shadow)}
.rv .sender{color:#f9a8b9;text-shadow:0 0 24px rgba(245,142,163,.35)}
.rv{background:radial-gradient(120% 80% at 50% 0%,rgba(245,142,163,.2),transparent 60%),linear-gradient(180deg,#4b215c,#27122f);--ink-2:#3a1a46;--ink-3:#4a235a}
.rv h1,.rv h2,.rv h3{text-shadow:none}
.rv .eyebrow,.rv .stack > .eyebrow{color:#f9a8b9;background:none;border:0;box-shadow:none;padding:0}
.rv .stack > .hint,.rv .hint{background:none;border:0;padding:0;color:#cbb3d5;display:block}
.rv a:not(.btn){color:#f9a8b9}
.rv .tag{background:rgba(255,255,255,.08);color:#f9a8b9;border-color:rgba(254,223,230,.45)}
.rv .tag.dim{color:var(--muted)}
.rv .pill{background:transparent}

/* ---------- chat.exe ---------- */
.inbox{gap:18px}
.conv{border:3px solid var(--edge);border-radius:10px;background:var(--surf);color:var(--fg);box-shadow:3px 3px 0 var(--shadow)}
.conv:hover{background:var(--surf-2);border-color:var(--edge)}
.conv.on{background:var(--surf-3);border-color:var(--edge)}
.conv-name{font-family:var(--f-display);font-weight:700;color:var(--accent-ink)}
.conv-last{color:var(--muted)}
.thread{--title:"♥ chat.exe";position:relative;border:3px solid var(--edge);border-radius:14px;background:var(--ink-2);padding:40px 10px 10px;gap:10px;box-shadow:5px 5px 0 var(--shadow),inset 0 0 0 2px var(--hi)}
.thread-empty{color:var(--muted)}
.thread-head{background:var(--surf-3);border:3px solid var(--edge);border-radius:10px;padding:8px 12px;gap:10px}
.thread-head .cb-ic{font-size:1.1rem;letter-spacing:.08em;color:var(--accent-ink);flex:none}
.thread-head b{font-family:var(--f-display);font-weight:700;font-size:1.05rem;color:var(--fg)}
.thread-head b::before{content:"Contact: ";font-weight:400;color:var(--muted)}
.thread-head small{color:var(--muted)}
.msgs{border:3px solid var(--edge);border-radius:10px;padding:18px 14px;gap:16px;min-height:280px;
  background:url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20width%3D'160'%20height%3D'160'%20viewBox%3D'0%200%20160%20160'%20shape-rendering%3D'crispEdges'%3E%3Cpath%20d%3D'M20%2015L22.52%2021.48L29%2024L22.52%2026.52L20%2033L17.48%2026.52L11%2024L17.48%2021.48Z'%20fill%3D'%23ffe58a'%2F%3E%3Cpath%20d%3D'M74%209L75.4%2012.6L79%2014L75.4%2015.4L74%2019L72.6%2015.4L69%2014L72.6%2012.6Z'%20fill%3D'%23ffffff'%2F%3E%3Cpath%20d%3D'M128%2022L130.24%2027.759999999999998L136%2030L130.24%2032.24L128%2038L125.76%2032.24L120%2030L125.76%2027.759999999999998Z'%20fill%3D'%23ffffff'%2F%3E%3Cpath%20d%3D'M44%2065L45.4%2068.6L49%2070L45.4%2071.4L44%2075L42.6%2071.4L39%2070L42.6%2068.6Z'%20fill%3D'%23ffd0e6'%2F%3E%3Cpath%20d%3D'M100%2072L102.8%2079.2L110%2082L102.8%2084.8L100%2092L97.2%2084.8L90%2082L97.2%2079.2Z'%20fill%3D'%23ffe58a'%2F%3E%3Cpath%20d%3D'M146%2091L147.4%2094.6L151%2096L147.4%2097.4L146%20101L144.6%2097.4L141%2096L144.6%2094.6Z'%20fill%3D'%23c9a6ee'%2F%3E%3Cpath%20d%3D'M18%20114L19.68%20118.32L24%20120L19.68%20121.68L18%20126L16.32%20121.68L12%20120L16.32%20118.32Z'%20fill%3D'%23ffffff'%2F%3E%3Cpath%20d%3D'M70%20128L72.24%20133.76L78%20136L72.24%20138.24L70%20144L67.76%20138.24L62%20136L67.76%20133.76Z'%20fill%3D'%23ffd0e6'%2F%3E%3Cpath%20d%3D'M122%20139L123.4%20142.6L127%20144L123.4%20145.4L122%20149L120.6%20145.4L117%20144L120.6%20142.6Z'%20fill%3D'%23ffe58a'%2F%3E%3Cpath%20d%3D'M150%2058L151.12%2060.88L154%2062L151.12%2063.12L150%2066L148.88%2063.12L146%2062L148.88%2060.88Z'%20fill%3D'%23ffffff'%2F%3E%3Cpath%20d%3D'M58%2096L59.12%2098.88L62%20100L59.12%20101.12L58%20104L56.88%20101.12L54%20100L56.88%2098.88Z'%20fill%3D'%23ffffff'%2F%3E%3Cpath%20d%3D'M96%2042L97.12%2044.88L100%2046L97.12%2047.12L96%2050L94.88%2047.12L92%2046L94.88%2044.88Z'%20fill%3D'%23ffd0e6'%2F%3E%3C%2Fsvg%3E") 0 0/160px 160px,conic-gradient(var(--chk1) 25%,var(--chk2) 0 50%,var(--chk1) 0 75%,var(--chk2) 0) 0 0/52px 52px}
.msgs .thread-empty{background:var(--surf);border:3px solid var(--edge);border-radius:10px;padding:14px;margin:auto;max-width:300px}
.msg{display:flex;gap:10px;align-items:flex-end;max-width:100%;padding:0;background:none;border:0;border-radius:0}
.msg.me{flex-direction:row-reverse;align-self:flex-end;background:none;border:0}
.msg.them{align-self:flex-start;background:none;border:0}
.av-px{width:44px;height:44px;flex:none;display:grid;place-items:center;font-size:1.55rem;background:var(--white);border:3px solid var(--edge);border-radius:10px;box-shadow:0 3px 0 var(--shadow)}
.bub{position:relative;max-width:min(78%,420px);padding:10px 14px;border:3px solid var(--edge);border-radius:16px;overflow-wrap:anywhere;box-shadow:0 4px 0 var(--shadow)}
.msg.them .bub{background:var(--amber);color:var(--on-acc)}
.msg.me .bub{background:var(--bub-me);color:var(--fg)}
.bub::after{content:"";position:absolute;bottom:12px;width:14px;height:14px;background:inherit;transform:rotate(45deg)}
.msg.them .bub::after{left:-9px;border-left:3px solid var(--edge);border-bottom:3px solid var(--edge)}
.msg.me .bub::after{right:-9px;border-right:3px solid var(--edge);border-top:3px solid var(--edge)}
.msg p{white-space:pre-wrap;font-size:1rem}
.msg small{display:block;font-size:.7rem;opacity:.75;margin-top:3px}
.composer{position:relative;display:flex;gap:8px;padding:2px 0 0;border:0;align-items:stretch}
.composer textarea{min-height:46px;border-radius:8px}
.emo-btn{flex:none;min-width:58px;font:700 1.05rem var(--f-display);color:var(--accent-ink);background:var(--white);border:3px solid var(--edge);border-radius:8px;box-shadow:0 3px 0 var(--edge);cursor:pointer}
.emo-btn:hover,.emo-btn[aria-expanded="true"]{background:var(--surf-3)}
.composer .emoji-pop{top:auto;bottom:calc(100% + 8px);left:auto;right:0}
.thread .err{padding:0 6px 4px}

@media (max-width:1000px){.top-in{padding:8px 12px}}
[hidden]{display:none!important}
.thread-head{flex-wrap:wrap}
.thread-head div{flex:1 1 160px;min-width:160px}
@media (max-width:520px){
  .thread-head .cb-ic{display:none}
  .top{padding-left:8px;padding-right:8px}
  .top-in{padding:8px 8px}
  nav{gap:2px}
  nav a{font-size:.84rem;padding:5px 1px;letter-spacing:-.01em}
  .brand{font-size:1.2rem}
  h1{font-size:clamp(1.9rem,9vw,2.4rem)}
}

/* text that sits straight on the scenery gets a pixel "plate" so it never competes with the trees */
h1{background:var(--plate);border:3px solid var(--edge);border-radius:12px;padding:8px 16px;box-shadow:4px 4px 0 var(--shadow);text-shadow:none;display:inline-block;max-width:100%}
.panel h1,.thread h1,.rv h1{background:none;border:0;box-shadow:none;padding:0;display:block;border-radius:0}
.lede,.wrap > p.muted,.wrap > .muted:not(.panel):not(div){background:var(--plate);border:3px solid var(--edge);border-radius:10px;padding:8px 14px;display:inline-block;color:var(--muted);box-shadow:3px 3px 0 var(--shadow)}
.hero .lede{color:var(--lede)}
.eyebrow{display:table;margin-bottom:6px}
.hero .eyebrow{margin-bottom:0}
.wrap > .eyebrow,.hero .eyebrow{background:var(--surf);border:2px solid var(--edge);padding:2px 10px;border-radius:6px;box-shadow:0 3px 0 var(--edge)}
.hero .pool{background:var(--plate);border:2px solid var(--edge);border-radius:8px;padding:3px 12px}
.panel .eyebrow,.rv .eyebrow,.thread .eyebrow{background:none;border:0;box-shadow:none;padding:0;border-radius:0}
.stranger{background:var(--plate);border:3px solid var(--edge);border-radius:12px;padding:8px 14px;box-shadow:3px 3px 0 var(--shadow)}
.note-q{background:var(--plate);border:3px solid var(--edge);border-radius:10px;padding:8px 12px;box-shadow:3px 3px 0 var(--shadow)}
.rv .note-q{background:rgba(255,255,255,.07);border-color:var(--line-2);box-shadow:none}
.mood-item > .hint,.sec-h{display:inline-block;background:var(--plate);border:2px solid var(--edge);border-radius:8px;padding:2px 10px;color:var(--muted)}
.waiting{background:var(--plate);border:3px solid var(--edge);border-radius:14px;padding:24px 18px;box-shadow:5px 5px 0 var(--shadow)}
.empty h2{display:block}
.how b{font-family:var(--f-display)}
.stack > .eyebrow,.stack > .hint,.stack > p.hint,.stack > .muted:not(.panel){display:inline-block;align-self:flex-start;background:var(--plate);border:2px solid var(--edge);border-radius:8px;padding:2px 10px;color:var(--muted)}
.placeholder-card{background:var(--plate)}
.wrap > p.hint,.wrap > .hint{display:inline-block;background:var(--plate);border:2px solid var(--edge);border-radius:8px;padding:2px 10px;color:var(--muted)}

#howPanel{--title:"♥ how.exe"} #checkPanel{--title:"♥ checklist.exe"} #pixPanel{--title:"♥ avatar.exe"} #authForm{--title:"♥ login.exe"} #offerForm{--title:"submit.exe"} #nameForm{--title:"♥ name.exe"} #reactForm{--title:"♥ react.exe"} #pfForm{--title:"♥ profile.exe"} #offerPick{--title:"♥ offer.exe"}

/* each window has its own day/night (data-wmode); by default it follows the desktop */
.win[data-wmode="light"]{--ink:var(--surf);--ink-2:#fee8ec;--ink-3:var(--surf-lav);--line:rgba(140,69,168,.22);--line-2:rgba(140,69,168,.45);--fg:#421853;--muted:#632f78;--faint:#7e4a92;--amber:#f58ea3;--ember:#d63354;--wine:#491a5c;--ok:#61237a;--bad:#c22545;--f-display:'Pixelify Sans','Silkscreen','Courier New',monospace;--f-body:'DM Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;--f-pixel:'Silkscreen', 'Courier New', monospace;--r:14px;--r-sm:8px;--ease:cubic-bezier(.2,.7,.2,1);--edge:#632a7a;--accent-ink:#8c45a8;--shadow:rgba(99,42,122,.3);--surf:#fff7f9;--surf-2:#fee4e9;--surf-3:#fddbe2;--surf-lav:#f4e6f9;--surf-lav2:#ecd5f5;--surf-bad:#fee4e9;--white:#ffffff;--plate:rgba(255,247,249,.92);--lede:#502063;--lab-bg:#f9e9ec;--hi:#fff4f7;--ph:#9361a6;--inset:rgba(140,69,168,.16);--band:rgba(210,156,232,.92);--chk1:#ebd3f5;--chk2:#fbd4dc;--bub-me:#fff8fa;color-scheme:light}
.win[data-wmode="night"]{--ink:#27122f;--ink-2:#34193f;--ink-3:#482556;--edge:#d9aaeb;--line:rgba(217,170,235,.25);--line-2:rgba(217,170,235,.5);--fg:#f2e6f7;--muted:#dabde6;--faint:#bc9ac9;--accent-ink:#f9a8b9;--ember:#f86381;--ok:#e07e92;--bad:#fb93a8;--shadow:rgba(0,0,0,.5);--surf:#341640;--surf-2:#4a235a;--surf-3:#5e3070;--surf-lav:#432150;--surf-lav2:#663a78;--surf-bad:#40204d;--white:#220f2a;--plate:rgba(39,18,47,.93);--lede:#f2e6f7;--lab-bg:#331d3b;--hi:rgba(255,255,255,.07);--ph:#ad88bc;--inset:rgba(0,0,0,.4);--band:rgba(44,13,57,.94);--chk1:#5b2a6e;--chk2:#5b2470;--bub-me:#532a63;color-scheme:dark}
.win[data-wmode="night"],.win[data-wmode="light"]{color:var(--fg)}
/* ===================== NIGHT MODE ===================== */
html[data-mode="night"]{
  --ink:#27122f; --ink-2:#34193f; --ink-3:#482556;
  --edge:#d9aaeb; --line:rgba(217,170,235,.25); --line-2:rgba(217,170,235,.5);
  --fg:#f2e6f7; --muted:#dabde6; --faint:#bc9ac9;
  --accent-ink:#f9a8b9; --ember:#f86381; --ok:#e07e92; --bad:#fb93a8;
  --shadow:rgba(0,0,0,.5);
  --surf:#341640; --surf-2:#4a235a; --surf-3:#5e3070; --surf-lav:#432150; --surf-lav2:#663a78; --surf-bad:#40204d;
  --white:#220f2a; --plate:rgba(39,18,47,.93); --lede:#f2e6f7; --lab-bg:#331d3b; --hi:rgba(255,255,255,.07); --ph:#ad88bc; --inset:rgba(0,0,0,.4);
  --band:rgba(44,13,57,.94); --chk1:#5b2a6e; --chk2:#5b2470; --bub-me:#532a63;
