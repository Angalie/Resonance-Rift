        const fp = e.target.closest('[data-fp]'); if (fp) return openPerson(fp.dataset.fp);
        const a = e.target.closest('[data-fa]'), d = e.target.closest('[data-fd]'); if (!a && !d) return;
        const f = fr.find(x => x.id === (a || d).dataset[a ? 'fa' : 'fd']); if (!f) return;
        $$('button', box).forEach(b => (b.disabled = true));
        try { await answerFriend(f, !!a); toast(a ? 'You are friends now.' : 'Declined.'); await refreshCounts(false); reload(); } catch { toast('Could not do that. Try again.'); }
      };
    },
  };
}

/* ---------- find by mood ---------- */
async function renderMoods() {
  const cur = moodOf(S.moodPick) ? S.moodPick : MOODS[0].k;
  view().innerHTML = `<p class="eyebrow">Find by mood</p>
    <h1 style="font-size:clamp(2rem,5vw,2.8rem);margin-top:6px">What fits right now?</h1>
    <p class="muted" style="margin-top:8px;max-width:58ch">Listeners tag every song they get in a swap. Pick a mood to see the songs strangers felt that way about, most-tagged first.</p>
    <fieldset style="margin-top:18px"><legend class="sr">Mood</legend><div class="chips" id="moodPick">
      ${MOODS.map(m => `<label class="chip" style="margin:0;font-weight:500"><input type="radio" name="mp" value="${m.k}"${m.k === cur ? ' checked' : ''}><span>${m.i} ${m.l}</span></label>`).join('')}
    </div></fieldset>
    <div id="moodRes" class="mood-res" aria-live="polite"><p class="muted">Looking through the crates…</p></div>`;
  $$('input[name=mp]').forEach(r => r.onchange = () => { S.moodPick = r.value; load(r.value); });
  async function load(mood) {
    const box = $('#moodRes'); if (!box) return;
    box.innerHTML = '<p class="muted">Looking through the crates…</p>';
    let tags;
    try { tags = await S.store.listTagged(mood); } catch { box.innerHTML = '<p class="err">Could not load songs for that mood. Try again.</p>'; return; }
    if (S.moodPick && S.moodPick !== mood && S.route === 'moods') return; // a newer pick is loading
    const groups = new Map();
    for (const t of tags) {
      if (!t || !parseSongLink(t.url)) continue;
      // The same song from different services counts as one when the name and artist match.
      const gk = t.title && t.artist ? `t:${t.title.trim().toLowerCase()}|${t.artist.trim().toLowerCase()}` : t.key;
      const g = groups.get(gk) || { url: t.url, title: '', artist: '', note: '', votes: 0, last: 0 };
      g.votes++; g.last = Math.max(g.last, +t.at || 0);
      if (!g.title && t.title) { g.title = t.title; g.artist = t.artist; }
      if (!g.note && t.note) g.note = t.note;
      groups.set(gk, g);
    }
    const list = [...groups.values()].sort((a, b) => b.votes - a.votes || b.last - a.last).slice(0, 30);
    const m = moodOf(mood);
    if (!list.length) {
      box.innerHTML = `<div class="panel empty" style="grid-column:1/-1">${orb(90)}<h2>No ${esc(m.l.toLowerCase())} songs yet</h2><p class="muted">Songs show up here once someone tags them after a swap.</p><a class="btn primary" href="#find">Find a song</a></div>`;
      return;
    }
    box.innerHTML = list.map(g => `<article class="mood-item">
      ${playerCard({ url: g.url, title: g.title, artist: g.artist, note: g.note }, { tag: m.l.toUpperCase(), embed: false })}
      <p class="hint" style="margin:0">${m.i} Tagged ${esc(m.l.toLowerCase())} ${g.votes} time${g.votes === 1 ? '' : 's'}</p>
    </article>`).join('');
  }
  load(cur);
}

/* ---------- notifications (Matches) + direct messages (Inbox) ----------
   Notes: bs_notes/<id> {to, type, pairId, text, at}. Unread = newer than user.notesSeenAt.
   Messages: bs_msgs/<id> {pairId, users, from, text, at}. Unread = newer than user.readAt[pairId].
   DMs only open once BOTH people have reacted (the seal is broken both ways) and neither blocked. */
const NOTE_ICON = { match: '🛸', accepted: '🛸', offer: '📨', declined: '🚫', friend: '🤝', reacted: '🎧', thanks: '💌', gift: '📼', message: '✉️' };

/* ---------- Cassettes: the in-app currency ----------
   Balance = 10 to start + 1 per song you react to + cassettes received − cassettes given.
   Every gift is a ledger doc bs_gifts/<id> {from, to, amount, pairId, at}, so nobody's client
   ever edits another person's balance; it's always recomputed from the ledger. */
const CASSETTE_START = 10, GIFT_AMOUNTS = [1, 3, 5];
const giftAmt = g => Math.max(0, Math.min(5, Math.floor(+g?.amount || 0)));
function cassettes(u = S.user, gin = S.giftsIn, gout = S.giftsOut) {
  if (!u) return 0;
  return CASSETTE_START + (u.stats.reactions || 0) + gin.reduce((a, g) => a + giftAmt(g), 0) - gout.reduce((a, g) => a + giftAmt(g), 0);
}
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
async function giveCassettes(pair, n, from = me()) {
  const to = pair.users.find(x => x !== from), id = uid('g_');
  await S.store.put(GIFTS, id, { id, from, to, amount: n, pairId: pair.id, at: Date.now() });
  await S.store.patch(PAIRS, pair.id, { gifts: { [from]: n } });
  await notify(to, 'gift', pair.id, `Your stranger gave you ${plural(n, 'cassette')} for your song.`);
}
const BOT_REPLIES = ['Glad the song found you.', 'Ha, I had a feeling you would like it.', 'Okay, I need more songs like the one you sent.', 'First time a stranger got my taste this right.'];
const isBotName = n => n === 'test_stranger' || String(n || '').startsWith('bot_');
function canMessage(p) { return !!p && p.users.every(x => p.reactions?.[x]) && !Object.values(p.removed || {}).some(Boolean); }
async function notify(to, type, pairId, text) {
  if (!to || isBotName(to)) return;
  const id = uid('n_');
  try { await S.store.put(NOTES, id, { id, to, type, pairId, text: String(text).slice(0, 140), at: Date.now() }); } catch (e) { console.warn('notify failed', e); }
}
function timeAgo(t) {
  const s = Math.max(0, (Date.now() - t) / 1000);
  if (s < 60) return 'just now'; if (s < 3600) return `${Math.floor(s / 60)}m ago`; if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
  return new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}
/** Polls notes + messages (every 12 s while logged in), updates header badges, toasts new arrivals. */
async function refreshCounts(toastNew = false) {
  if (!S.user) return;
  try {
    const q = (col, f, op, v) => S.store.listWhere(col, f, op, v);
    const [notes, msgs, gin, gout, oin, oout, fr] = await Promise.all([q(NOTES, 'to', '==', me()), q(MSGS, 'users', 'array-contains', me()),
      q(GIFTS, 'to', '==', me()), q(GIFTS, 'from', '==', me()), q(OFFERS, 'to', '==', me()), q(OFFERS, 'from', '==', me()), q(FRIENDS, 'users', 'array-contains', me())]);
    if (!S.user) return;
    S.giftsIn = gin.filter(g => g && g.to === me()); S.giftsOut = gout.filter(g => g && g.from === me());
    S.offersIn = oin.filter(o => o && o.to === me()); S.offersOut = oout.filter(o => o && o.from === me());
    S.friends = fr.filter(f => f && Array.isArray(f.users) && f.users.includes(me()));
    S.notes = notes.filter(n => n && n.to === me()).sort((a, b) => b.at - a.at);
    S.msgs = msgs.filter(m => m && Array.isArray(m.users) && m.users.includes(me()));
    await syncPairs();
    const rd = S.user.readAt || {};
    S.counts = {
      notes: S.notes.filter(n => n.at > (S.user.notesSeenAt || 0)).length,
      msgs: S.msgs.filter(m => m.from !== me() && m.at > (rd[m.pairId] || 0)).length,
      reqs: S.offersIn.filter(isLive).length,
      todo: S.pairs.filter(p => !p.reactions?.[me()] && !p.removed?.[me()]).length,
      fr: S.friends.filter(f => f.status === 'pending' && f.from !== me()).length,
    };
    if (toastNew) S.notes.filter(n => n.at > (S.lastNoteAt || 0)).slice(0, 2).forEach(n => toast(`${NOTE_ICON[n.type] || '🔔'} ${n.text}`));
    S.lastNoteAt = Math.max(S.lastNoteAt || 0, ...S.notes.map(n => n.at));
    renderWho();
    document.dispatchEvent(new Event('bs-counts'));
    if (S.offersOut.some(o => isLive(o) && isBotName(o.to))) resolveBotOffers();   // sample strangers answer (also after a refresh)
  } catch (e) { console.warn('could not refresh notifications', e); }
}
async function sendMessage(pair, text) {
  const id = uid('m_');
  await S.store.put(MSGS, id, { id, pairId: pair.id, users: pair.users, from: me(), text, at: Date.now() });
  await notify(partnerOf(pair), 'message', pair.id, `New message from ${pair.songs[me()]?.displayName || 'your stranger'}`);
  if (pair.bot) { // sample/test strangers answer once in a while so the inbox can be tested solo
    setTimeout(async () => {
      try {
        const rid = uid('m_');
        await S.store.put(MSGS, rid, { id: rid, pairId: pair.id, users: pair.users, from: pair.bot, text: pick(BOT_REPLIES), at: Date.now() });
        await notify(me(), 'message', pair.id, `New message from ${pair.songs[pair.bot]?.displayName || 'your stranger'}`);
        refreshCounts(false);
      } catch {}
    }, 2500 + Math.random() * 2500);
  }
}

const ANIMALS = ['🐱', '🐰', '🐻', '🦊', '🐸', '🐹', '🐼', '🐥', '🦄', '🐧'];
const animalOf = s => ANIMALS[[...String(s || '?')].reduce((n, c) => n + c.charCodeAt(0), 0) % ANIMALS.length];
async function renderInbox() {
  view().innerHTML = `<p class="eyebrow">Inbox</p><h1 style="font-size:clamp(2rem,5vw,2.8rem);margin-top:6px">Messages</h1>
    <p class="muted" style="margin-top:8px">You can message a stranger once you've both reacted and the seal has broken.</p>
    <div class="inbox" id="inbox"><p class="muted">Loading…</p></div>`;
  await refreshCounts(false);
  let pairs = [];
  try { pairs = (await Promise.all(S.user.pairIds.map(id => S.store.get(PAIRS, id)))).filter(canMessage); }
  catch { const b = $('#inbox'); if (b) b.innerHTML = '<p class="err">Could not load your messages. Refresh to try again.</p>'; return; }
  const box = $('#inbox'); if (!box || S.route !== 'inbox') return;
  if (!pairs.length) {
    box.innerHTML = `<div class="panel empty" style="grid-column:1/-1">${orb(90)}<h2>No conversations yet</h2><p class="muted">Finish a swap where you both react, then tap “Message them” on the reveal.</p><a class="btn primary" href="#find">Find a song</a></div>`;
    return;
  }
  let cur = pairs.some(p => p.id === S.inboxPair) ? S.inboxPair : null;
  const msgsFor = pid => S.msgs.filter(m => m.pairId === pid).sort((a, b) => a.at - b.at);
  const lastAt = p => { const m = msgsFor(p.id); return m.length ? m[m.length - 1].at : p.createdAt; };
  const markRead = async pid => {
    const last = msgsFor(pid).filter(m => m.from !== me()).pop();
    if (last && last.at > (S.user.readAt[pid] || 0)) { S.user.readAt[pid] = last.at; try { await S.store.putUser(S.user); } catch {} refreshCounts(false); }
  };
  const nameOf = m => pairs.find(x => x.id === m.pairId)?.songs?.[m.from]?.displayName || m.from;
  const msgHTML = m => `<div class="msg ${m.from === me() ? 'me' : 'them'}"><span class="av-px" aria-hidden="true">${animalOf(nameOf(m))}</span><div class="bub"><p>${esc(m.text)}</p><small>${esc(timeAgo(m.at))}</small></div></div>`;

  function draw() {
    pairs.sort((a, b) => lastAt(b) - lastAt(a));
    const rd = S.user.readAt;
    const p = pairs.find(x => x.id === cur), other = p && partnerOf(p), them = p && p.songs[other];
    box.classList.toggle('open', !!p);
    box.innerHTML = `<div class="inbox-list" role="list">${pairs.map(x => {
      const o = partnerOf(x), t = x.songs[o], ms = msgsFor(x.id), last = ms[ms.length - 1];
      const un = ms.filter(m => m.from !== me() && m.at > (rd[x.id] || 0)).length;
      return `<button type="button" role="listitem" class="conv${x.id === cur ? ' on' : ''}" data-p="${esc(x.id)}">
        <span class="conv-name">${esc(t?.displayName || 'A stranger')}</span>
        <span class="conv-last">${last ? esc((last.from === me() ? 'You: ' : '') + last.text) : 'Say hi. You both reacted.'}</span>
        ${un ? `<b class="dot" aria-label="${un} unread">${un}</b>` : ''}</button>`; }).join('')}</div>
      <section class="thread" aria-label="Conversation">${p ? `
        <header class="thread-head">
          <button type="button" class="btn small back" id="tBack">‹ Back</button>
          <span class="cb-ic" aria-hidden="true">☺ ♥ ★</span>
          <div><b>${esc(them?.displayName || 'A stranger')}</b><small>Swapped ${esc(them?.title || 'a song')}${them?.artist ? ' by ' + esc(them.artist) : ''}</small></div>
          <button type="button" class="btn small" id="tProf">View profile</button>
          <button type="button" class="btn small danger" id="tBlock">Report & block</button>
        </header>
        <div id="tConfirm"></div>
        <div class="msgs" id="msgs" aria-live="polite">${msgsFor(p.id).map(msgHTML).join('') || '<p class="muted thread-empty">No messages yet. Say what the song did for you.</p>'}</div>
        <form class="composer" id="msgForm" novalidate><label for="msgIn" class="sr">Message</label>
          <textarea id="msgIn" maxlength="300" rows="1" placeholder="type message…"></textarea>
          <button type="button" class="emo-btn" id="msgEmoji" aria-label="Insert emoji" aria-expanded="false" aria-controls="msgPop">♥✦</button>
          <button class="btn primary" id="msgSend" type="submit">Send</button>
          <div class="emoji-pop" id="msgPop" hidden>${PICK_EMOJI.map(e => `<button type="button" data-ins="${e}" aria-label="Insert ${e}">${e}</button>`).join('')}</div></form>
        <p class="err" id="msgErr" role="alert"></p>` : '<p class="muted thread-empty">Pick a conversation.</p>'}</section>`;
    $$('.conv', box).forEach(b => b.onclick = () => { cur = S.inboxPair = b.dataset.p; draw(); $('#msgIn')?.focus(); });
    if (!p) return;
    const ml = $('#msgs'); ml.scrollTop = ml.scrollHeight;
    markRead(p.id);
    $('#tBack').onclick = () => { cur = S.inboxPair = null; draw(); };
    $('#tProf').onclick = () => { S.inboxPair = p.id; openPerson(p.id); };
    $('#tBlock').onclick = () => {
      $('#tConfirm').innerHTML = `<div class="confirm" style="margin:12px 16px 0" role="alert"><span>Report and block this stranger? You won't see this conversation again, and they can't message you.</span>
        <button class="btn small danger" id="bYes" type="button">Report & block</button><button class="btn small" id="bNo" type="button">Cancel</button></div>`;
      $('#bNo').onclick = () => ($('#tConfirm').innerHTML = '');
      $('#bYes').onclick = async () => {
        try {
          await S.store.report({ id: uid('r_'), pairId: p.id, reporter: me(), reported: other, kind: 'messages', recent: msgsFor(p.id).filter(m => m.from === other).slice(-5).map(m => m.text), at: Date.now() });
          await S.store.patch(PAIRS, p.id, { removed: { [me()]: true } });
          pairs = pairs.filter(x => x.id !== p.id); cur = S.inboxPair = null; toast('Reported and blocked.');
          pairs.length ? draw() : renderInbox();
        } catch { toast('Could not block right now. Try again.'); }
      };
    };
    const inp = $('#msgIn'), pop = $('#msgPop'), eb = $('#msgEmoji');
    eb.onclick = () => { pop.hidden = !pop.hidden; eb.setAttribute('aria-expanded', String(!pop.hidden)); };
    pop.onclick = e => {
      const bt = e.target.closest('[data-ins]'); if (!bt || inp.value.length + bt.dataset.ins.length > 300) return;
      const s = inp.selectionStart ?? inp.value.length, en = inp.selectionEnd ?? s;
      inp.value = inp.value.slice(0, s) + bt.dataset.ins + inp.value.slice(en); inp.focus(); inp.setSelectionRange(s + bt.dataset.ins.length, s + bt.dataset.ins.length);
      pop.hidden = true; eb.setAttribute('aria-expanded', 'false');
    };
    inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#msgForm').requestSubmit(); } });
    $('#msgForm').onsubmit = async e => {
      e.preventDefault();
      const err = $('#msgErr'), text = inp.value.trim().slice(0, 300);
      err.textContent = '';
      if (!text) return;
      if (hasProfanity(text)) return (err.textContent = 'That message has a word we filter. Rephrase it and try again.');
      const fresh = await S.store.get(PAIRS, p.id).catch(() => p);
      if (!canMessage(fresh)) return (err.textContent = "This conversation is closed.");
      $('#msgSend').disabled = true;
      try { await sendMessage(p, text); inp.value = ''; await refreshCounts(false); shownSig = S.msgs.length; draw(); $('#msgIn')?.focus(); }
      catch { err.textContent = 'Could not send. Try again.'; }
      finally { const s = $('#msgSend'); if (s) s.disabled = false; }
    };
  }
  draw();
  // keep the open conversation fresh without re-rendering the composer
  let shownSig = S.msgs.length; // compare against what's on screen, not the last poll (others poll too)
  S.timers.push(setInterval(async () => {
    if (S.route !== 'inbox') return;
    await refreshCounts(false);
    if (S.msgs.length === shownSig) return;
    shownSig = S.msgs.length;
    const ml = $('#msgs'), inp = $('#msgIn');
    if (cur && ml) {
      ml.innerHTML = msgsFor(cur).map(msgHTML).join(''); ml.scrollTop = ml.scrollHeight; markRead(cur);
      $$('.conv', box).forEach(b => { if (b.dataset.p !== cur) return; const ms = msgsFor(cur), last = ms[ms.length - 1]; const l = b.querySelector('.conv-last'); if (l && last) l.textContent = (last.from === me() ? 'You: ' : '') + last.text; });
    } else if (!inp) draw();
  }, 4000));
}

/* ---------- profile (MySpace-style) ---------- */
const pad6 = n => String(Math.max(0, n | 0)).padStart(6, '0');
const SPARKS = [[6, 8], [88, 5], [40, 3], [72, 22], [14, 38], [94, 44], [55, 52], [4, 66], [80, 70], [30, 82], [66, 90], [92, 94], [20, 14], [48, 30]];
const clamp01 = v => Math.max(0, Math.min(1, Number.isFinite(+v) ? +v : 0.5));
const gradCss = t => `linear-gradient(160deg,${isHex(t.c1) ? t.c1 : '#3a1630'},${isHex(t.c2) ? t.c2 : '#0d0a12'})`;
function profileBg(t, media) {
  const bg = safeImg(media?.bg);
  return t.bgMode === 'image' && bg ? `url('${bg.data}') center/cover no-repeat,${gradCss(t)}` : gradCss(t);
}
/** Size of an image "covering" a square box at zoom z, as multiples of the box. */
function coverDims(w, h, z) { const a = (w || 1) / (h || 1); return a >= 1 ? { W: a * z, H: z } : { W: z, H: z / a }; }
/** CSS that shows a cropped image inside a box. Used by the cropper AND for GIF avatars (keeps animation). */
function coverCss(url, w, h, c = {}) {
  const z = Math.max(1, Math.min(4, +c.z || 1)), { W, H } = coverDims(w, h, z);
  return `background-image:url('${url}');background-size:${(W * 100).toFixed(2)}% ${(H * 100).toFixed(2)}%;background-position:${(clamp01(c.ox) * 100).toFixed(2)}% ${(clamp01(c.oy) * 100).toFixed(2)}%`;
}
/** Avatar (uploaded image, or an initial on your profile colors) inside the chosen frame. */
function avatarHTML(u, p, media, size = 84) {
  const t = p.theme, im = safeImg(media?.avatar), f = FRAMES[t.frame] ? t.frame : 'none';   // no uploaded picture: show the pixel avatar instead of a letter
  const px = p.pix || u.profile?.pix;
  const inner = im ? `<span class="av-img" style="${coverCss(im.data, im.w, im.h, im.crop)}"></span>`
    : `<span class="av-img" style="background:${gradCss(t)}">${px ? `<img alt="" src="${pixAvatarURL(normalizePix(px))}" style="width:100%;height:100%;object-fit:cover;image-rendering:pixelated;display:block">` : esc((u.username || '?')[0].toUpperCase())}</span>`;
  return `<span class="avf fr-${f}" style="--sz:${size}px" role="img" aria-label="@${esc(u.username)}'s profile picture">${inner}${(FRAMES[f].deco || []).map((d, i) => `<i class="fd fd${i}" aria-hidden="true">${d}</i>`).join('')}</span>`;
}
function nametagHTML(name, kind) {
  const n = '@' + name, k = NAMETAGS[kind] ? kind : 'plain';
  if (k === 'hello') return `<div class="nt nt-hello"><b>HELLO</b><small>my name is</small><span>${esc(n)}</span></div>`;
  if (k === 'cassette') return `<div class="nt nt-cassette"><i aria-hidden="true"></i><span>${esc(n)}</span><i aria-hidden="true"></i></div>`;
  if (k === 'ransom') return `<div class="nt nt-ransom" role="img" aria-label="${esc(n)}">${[...n].map((ch, i) => `<span class="rn${i % 5}" style="--r:${[-6, 4, -3, 7, -5, 2][i % 6]}deg" aria-hidden="true">${esc(ch)}</span>`).join('')}</div>`;
  return `<div class="nt nt-${k}">${esc(n)}</div>`;
}

/* Image helpers for the uploaders. */
const readDataURL = f => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(new Error('Could not read that file.')); r.readAsDataURL(f); });
const loadImg = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("That file isn't an image this browser can open.")); i.src = src; });
/** Draw onto a canvas and export at the first format/quality that fits under maxBytes. */
function bakeImage(w, h, draw, maxBytes) {
  for (const [type, q] of [['image/webp', 0.86], ['image/webp', 0.7], ['image/jpeg', 0.82], ['image/jpeg', 0.62], ['image/jpeg', 0.45]]) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const x = c.getContext('2d');
    if (type === 'image/jpeg') { x.fillStyle = '#111'; x.fillRect(0, 0, w, h); }
    draw(x);
    const d = c.toDataURL(type, q);
    if (d.startsWith('data:' + type) && d.length * 0.75 <= maxBytes) return d;
  }
  return null;
}
function checkFile(input) {
  const f = input.files?.[0]; input.value = '';
  if (!f) return null;
  if (!IMG_TYPES.includes(f.type)) throw new Error('Use a PNG, JPG, WebP or GIF file.');
  if (f.size > 15 * 1024 * 1024) throw new Error('That file is over 15 MB. Pick a smaller one.');
  return f;
}

  };
  const drawSix = t => {

    vx.restore();
  };
  const vDraw = now => {
    const mode = fxMode(), im = icons.querySelector('.dicon[data-app="rr"] img');

    if (!calm) vRaf = requestAnimationFrame(vDraw); else vRaf = 0;
    if (fxShown !== mode) { vx.clearRect(0, 0, VS, VS); fxShown = mode; }
    const t = calm ? 0 : (now - t0) / 1000, N = 84, R0 = 54, half = N / 2;
    const beat = calm ? 0 : Math.pow(Math.max(0, Math.sin(t * Math.PI * 2 * 2.1)), 6);   /* about 126 beats a minute */
    if (mode === 'six') { drawSix(t); if (im) im.style.transform = ''; return; }
    if (mode === 'five') { drawFive(t); if (im) im.style.transform = ''; return; }
    if (mode === 'four') { drawFour(t, beat); if (im) im.style.transform = 'scale(' + (1 + beat * .025).toFixed(3) + ')'; return; }
    if (mode === 'three') { drawThree(t, beat); if (im) im.style.transform = 'scale(' + (1 + beat * .03).toFixed(3) + ')'; return; }
    if (mode === 'two') { drawTwo(t, beat); if (im) im.style.transform = 'scale(' + (1 + .012 * Math.sin(t * 1.4)).toFixed(3) + ')'; return; }
    vx.clearRect(0, 0, VS, VS); vx.save(); vx.translate(VS / 2, VS / 2); vx.lineCap = 'round';

  icons.parentNode.insertBefore(waves, icons);
  /* waves flow only while the icon is in the middle of the desktop; move it away and they stop */
  const rrWaves = () => {
    const b = icons.querySelector('.dicon[data-app="rr"]'), D = deskEl(); if (!b) { waves.hidden = true; return; }
    const homeX = (D.clientWidth - b.offsetWidth) / 2, homeY = (D.clientHeight - b.offsetHeight) / 2 - 24;
    const near = Math.hypot(b.offsetLeft - homeX, b.offsetTop - homeY) < 36;
    waves.hidden = !near || fxMode() === 'off'; if (waves.hidden) return;
    if (!vRaf) vRaf = requestAnimationFrame(vDraw);
    const im = b.querySelector('img');

  const iconsLayout = () => {
    const D = deskEl(), saved = iconSaved(), per = Math.max(1, Math.floor((D.clientHeight - 16) / 96));
    let k = 0;
    icons.querySelectorAll('.dicon').forEach(b => {
      const rr = b.dataset.app === 'rr', i = rr ? 0 : k++;   /* the Resonance Rift icon starts big and in the middle; the others fill the left edge */
      const s = saved[b.dataset.app] || {}, x = Number.isFinite(s.x) ? s.x : rr ? (D.clientWidth - b.offsetWidth) / 2 : 8 + Math.floor(i / per) * 96, y = Number.isFinite(s.y) ? s.y : rr ? (D.clientHeight - b.offsetHeight) / 2 - 24 : 8 + (i % per) * 96;
      b.style.left = Math.max(0, Math.min(D.clientWidth - b.offsetWidth, x)) + 'px'; b.style.top = Math.max(0, Math.min(D.clientHeight - b.offsetHeight, y)) + 'px';
    });
    rrWaves();
  };
  iconsRefresh = () => { const hid = iconsHidden(); icons.innerHTML = Object.entries(OS.apps).filter(([k]) => appInstalled(k) && !hid.includes(k)).map(([k, a]) => `<button type="button" class="dicon" data-app="${k}"><img alt="" src="${ICO[a.icon]}"><span>${esc(a.label)}</span></button>`).join(''); iconsLayout(); };
  Object.entries(OS.apps).forEach(([k, a]) => { if (k !== 'rr' && k !== 'notepad' && k !== 'help') a.fresh = true; });   /* these windows are rebuilt each time they are opened */
  iconsRefresh(); window.addEventListener('resize', iconsLayout);
  let dragged = false;
  icons.addEventListener('pointerdown', e => {
    const b = e.target.closest('.dicon'); if (!b) return;
    if (e.button > 0) return;
    const D = deskEl(), sx = e.clientX, sy = e.clientY, ox = b.offsetLeft, oy = b.offsetTop, id = e.pointerId; let moved = false;
    const mv = ev => {
      if (ev.pointerId !== id) return;
      if (!moved && Math.hypot(ev.clientX - sx, ev.clientY - sy) < 3) return;
      if (!moved) { moved = true; b.classList.add('drag'); b.style.zIndex = 5; try { b.setPointerCapture(id); } catch {} }
      ev.preventDefault();
      b.style.left = Math.max(0, Math.min(D.clientWidth - b.offsetWidth, ox + ev.clientX - sx)) + 'px'; b.style.top = Math.max(0, Math.min(D.clientHeight - b.offsetHeight, oy + ev.clientY - sy)) + 'px';
      if (b.dataset.app === 'rr') {   /* magnetic: close to the middle, the icon snaps there */
        const hx = (D.clientWidth - b.offsetWidth) / 2, hy = (D.clientHeight - b.offsetHeight) / 2 - 24;

  icons.addEventListener('click', e => {

/* =====================================================================
   6. BOOT
   ===================================================================== */
(async function boot() {
  const { store, note } = await createStore();
  S.store = store; S.mode = store.mode; S.note = note;
  if (store.mode === 'local') { store.seed(); store.seedTags(); }
  setMode(currentMode(), false);
  document.addEventListener('click', e => {
    const t = e.target.closest('.mode-toggle'); if (!t) return;
    if (t.id === 'modeBtn') setMode(currentMode() === 'night' ? 'light' : 'night', true);   /* the taskbar switch is the desktop's day/night */
    else setWinMode('rr', rrMode() === 'night' ? 'light' : 'night');   /* the switch inside the site is the site window's own */
  });
  renderFooter();
  const name = session.get();
  if (name) {
    try { const u = await store.getUser(name); if (u) { S.user = normalizeUser(u); S.media = await loadMedia(name); await resumeSwap(); } } catch (e) { console.warn(e); }
  }
  render();
})();
